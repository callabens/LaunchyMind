      audience.kids: "yes"
      capability.ads: false
      capability.analytics: false
  - id: kids-with-ads
    rule: apple.kids-third-party
    expect: fail
    facts:
      platform.ios: true
      audience.kids: "yes"
      capability.ads: true
      capability.analytics: false

