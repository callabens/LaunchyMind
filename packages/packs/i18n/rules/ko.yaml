# Rule explanations (ko). Translated from the English rule texts; keep ids, file names, keys, and guideline numbers unchanged.
product.flutter-project:
  title: "이 검사 도구가 읽을 수 있는 종류의 프로젝트입니다"
  summary: "LaunchyMind는 Flutter, React Native, Expo, 네이티브 iOS, 네이티브 Android, Unity 프로젝트를 읽습니다. 이 중 어디에도 해당하지 않는 폴더에는 스토어 판정을 내리지 않습니다. 파일에서 드러나지 않는 사실은 미확인으로 남습니다."
product.audience-answers:
  title: "코드로는 답할 수 없는 대상 사용자 관련 질문"
  summary: "아동 대상 여부, 건강, 사용자 제작 콘텐츠는 코드에서 확실하게 읽을 수 없습니다. .launchymind/project.yaml에서 답할 때까지 이 항목들은 미확인으로 남습니다."
apple.kids-third-party:
  title: "아동 대상 앱은 서드파티 광고와 분석을 피해야 합니다"
  summary: "Apple은 주로 아동을 대상으로 하는 앱에 서드파티 분석이나 서드파티 광고를 포함해서는 안 된다고 말합니다. 대상 사용자 답변은 개발자의 진술이며, 키즈 카테고리 체크박스가 아닙니다."
apple.privacy-policy-in-app:
  title: "앱 안에 개인정보 처리방침 링크가 필요합니다"
  summary: "앱 소스에 아직 개인정보 처리방침 링크가 없습니다. 가이드라인 5.1.1(i)은 앱 안에 링크를 두도록 요구합니다. 빠진 것은 링크 하나뿐이며, 앱의 나머지 부분을 버려야 한다는 판단이 아닙니다."
  next: "설정처럼 사용자가 열 수 있는 화면에 개인정보 처리방침 URL을 추가한 뒤 다시 스캔하세요."
apple.privacy-policy-metadata:
  title: "스토어 메타데이터용 개인정보 처리방침 URL이 선언되어 있습니다"
  summary: "가이드라인 5.1.1(i)은 App Store Connect에도 개인정보 처리방침 링크를 요구합니다. LaunchyMind는 App Store Connect를 볼 수 없습니다. 로컬 선언이 없으면 실패가 아니라 미확인입니다."
  next: "프로젝트에 기록하려면 .launchymind/project.yaml에 urls.privacy를 설정하세요. 링크가 App Store Connect에만 있다면 비워 두세요."
apple.privacy-link-opens:
  title: "개인정보 처리방침 링크가 열립니다"
  summary: "앱 안과 메타데이터의 개인정보 링크는 실제 처리방침이어야 합니다. 이 검사는 프로젝트에서 찾은 URL에 요청을 보내 HTTP 오류와 임시 페이지를 표시합니다."
apple.privacy-policy-content:
  title: "처리방침 본문이 수집, 삭제, 동의를 다룹니다"
  summary: "가이드라인 5.1.1(i)에 따르면 처리방침은 어떤 데이터를 어떻게 수집하는지, 모든 용도, 제3자의 보호, 보관과 삭제, 그리고 사용자가 동의를 철회하거나 삭제를 요청하는 방법을 밝혀야 합니다. 키워드 일치는 추정 방법일 뿐 처리방침 검토가 아닙니다."
apple.support-contact:
  title: "지원 URL 또는 연락 방법이 있습니다"
  summary: "가이드라인 1.5에 따르면 사용자가 개발자에게 연락할 방법이 있어야 합니다. 프로젝트에 지원 URL이 없으면 LaunchyMind는 App Store Connect 항목을 볼 수 없으므로 결과는 미확인으로 남습니다. 선언된 페이지가 열리지 않는 경우는 별도 검사에서 다룹니다."
  next: "앱이나 project.yaml에 지원 URL을 추가하거나, App Store Connect의 지원 URL 항목을 직접 확인하세요."
apple.support-link-quality:
  title: "지원 페이지에 연락 방법이 나와 있습니다"
  summary: "지원 페이지는 사용자가 쉽게 연락할 수 있는 방법을 제공해야 합니다. 이 검사는 이메일 주소나 연락 문구를 찾고, 임시 페이지는 불합격 처리합니다."
apple.account-deletion:
  title: "계정 생성을 지원하면 앱 안에서 계정 삭제가 필요합니다"
  summary: "앱에서 계정을 만들 수 있다면 앱 안에서 계정을 삭제할 수도 있어야 합니다. 이 검사는 삭제 관련 심볼이나 앱 내 삭제 링크를 찾습니다. 해당 기능을 찾기 쉬운지는 판단할 수 없습니다."
apple.tracking-permission:
  title: "추적에는 App Tracking Transparency 고지가 필요합니다"
  summary: "사용자를 추적하려면 App Tracking Transparency API를 통해 명시적인 허락을 받아야 합니다. 광고 또는 추적 SDK가 있으면 이 검사는 NSUserTrackingUsageDescription을 요구합니다."
apple.login-equivalent:
  title: "서드파티 로그인에는 동등한 옵션이 필요합니다"
  summary: "기본 계정에 서드파티 또는 소셜 로그인을 사용하는 앱은 데이터를 이름과 이메일로 제한하고, 이메일을 숨길 수 있게 하며, 동의 없이 앱 내 상호작용을 광고 목적으로 수집하지 않는 동등한 로그인도 제공해야 합니다. Apple이 정한 예외는 이 검사로 확인할 수 없습니다."
apple.permission-camera:
  title: "카메라 사용에는 iOS 사용 목적 문구가 필요합니다"
  summary: "사용 목적 문구는 데이터 사용을 명확하고 충분하게 설명해야 합니다. 카메라 기능이 감지되었는데 NSCameraUsageDescription이 없으면 이 검사는 실패합니다."
apple.permission-photos:
  title: "사진 보관함 사용에는 iOS 사용 목적 문구가 필요합니다"
  summary: "사진 보관함에 접근하려면 용도를 설명하는 사용 목적 문구가 필요합니다. NSPhotoLibraryUsageDescription 또는 NSPhotoLibraryAddUsageDescription이 있으면 존재 여부 검사를 통과합니다."
apple.permission-location:
  title: "위치 사용에는 iOS 사용 목적 문구가 필요합니다"
  summary: "위치에 접근하려면 사용 목적 문구가 필요합니다. 앱 사용 중 또는 항상 허용 키가 있으면 존재 여부 검사를 통과합니다."
apple.permission-microphone:
  title: "마이크 사용에는 iOS 사용 목적 문구가 필요합니다"
  summary: "마이크에 접근하려면 용도를 설명하는 NSMicrophoneUsageDescription이 필요합니다."
apple.permission-contacts:
  title: "연락처 사용에는 iOS 사용 목적 문구가 필요합니다"
  summary: "연락처에 접근하려면 용도를 설명하는 NSContactsUsageDescription이 필요합니다."
apple.privacy-manifest-reasons:
  title: "개인정보 보호 매니페스트의 사유 필수 API에는 사유 코드가 필요합니다"
  summary: "2024년 5월 1일부터 사유 필수 API를 사용하면서 개인정보 보호 매니페스트에 사유를 기술하지 않은 앱은 App Store Connect에서 받아들여지지 않습니다. 이 검사는 프로젝트 매니페스트가 사유 코드 없이 API를 나열한 경우에만 실패합니다."
apple.listed-sdk-manifest:
  title: "목록에 있는 서드파티 SDK에는 개인정보 보호 매니페스트가 필요합니다"
  summary: "Apple은 제출물에 포함된 목록상의 SDK에 개인정보 보호 매니페스트를 요구합니다. LaunchyMind의 버전 관리 표에 있는 플러그인은 자체 PrivacyInfo.xcprivacy를 포함하므로 미확인으로 남지 않습니다. 표에 없는 목록상의 SDK는 여전히 확인 진술이 필요합니다."
  next: "포함된 매니페스트 표에 없는 목록상의 SDK는 pod나 패키지를 확인하고, 파일을 직접 본 뒤에만 apple.listed-sdk-manifests를 설정하세요."
apple.minimum-os:
  title: "업로드는 iOS 13 이상을 대상으로 해야 합니다"
  summary: "2026년 9월 9일부터 App Store Connect에 업로드하는 iOS 및 iPadOS 앱은 iOS 13 이상을 대상으로 해야 합니다."
apple.xcode-sdk:
  title: "업로드는 Xcode 26과 iOS 26 SDK로 빌드해야 합니다"
  summary: "2026년 4월 28일부터 App Store Connect에 업로드하는 앱은 Xcode 26 이상에서 iOS 26, iPadOS 26, tvOS 26, visionOS 26 또는 watchOS 26 SDK로 빌드해야 합니다. 프로젝트 소스에는 Xcode 버전이 없으므로 이 검사는 명시적인 확인 진술을 사용합니다."
apple.age-rating:
  title: "업데이트된 연령 등급 질문에 답해야 합니다"
  summary: "업데이트 제출이 중단되지 않으려면 Apple의 연령 등급 질문에 2026년 1월 31일까지 답해야 했습니다. App Store Connect를 조회하지 않았으므로 이 검사는 명시적인 확인 진술을 사용합니다."
apple.subscription-terms:
  title: "구독 구매 화면에서 혜택을 설명해야 합니다"
  summary: "고객에게 구독을 요청하기 전에 앱은 그 가격으로 무엇을 받는지 명확하게 설명해야 합니다. 이 검사는 구독과 가격 관련 단어 또는 확인 진술을 찾습니다. 개발자 계약의 Schedule 2는 읽지 않습니다."
google.target-api:
  title: "신규 앱과 업데이트는 Android 16(API 36)을 타겟팅해야 합니다"
  summary: "2026년 8월 31일부터 신규 앱과 업데이트는 Android 16(API 수준 36) 이상을 타겟팅해야 하며, 이 스캐너가 감지하지 못하는 폼 팩터별 예외가 있습니다. 고객센터 페이지의 연장 기한은 2026년 11월 1일까지였습니다."
google.privacy-policy:
  title: "Play에는 개인정보처리방침 링크가 필요합니다"
  summary: "Google Play는 사용자 데이터를 수집하지 않는 앱을 포함해 모든 개발자가 데이터 보안 섹션을 작성하고 개인정보처리방침 링크를 제공해야 한다고 말합니다. Play Console은 조회하지 않았습니다."
google.data-safety-form:
  title: "데이터 보안 섹션을 작성해야 합니다"
  summary: "Google Play에 앱이 있는 모든 개발자는 데이터 보안 섹션을 작성해야 하며, SDK의 데이터 수집도 포함됩니다. 내부 테스트 트랙에만 있는 앱은 면제됩니다. Play Console을 조회하지 않았으므로 확인 진술을 사용합니다."
google.account-deletion:
  title: "계정 생성을 지원하면 앱 내 경로와 웹 삭제 링크가 필요합니다"
  summary: "앱에서 계정을 만들 수 있다면 Google Play는 앱 안에서 계정을 삭제하는 경로와 사용자가 삭제를 요청할 수 있는 웹 링크를 요구합니다. 그 웹 리소스로 가는 앱 내 링크를 앱 내 경로로 삼을 수 있습니다."
google.account-deletion-link:
  title: "웹 계정 삭제 링크가 열리고 앱 이름이 나와야 합니다"
  summary: "Google에 따르면 웹 링크는 로드되어야 하고, 삭제 경로를 찾기 쉬워야 하며, 스토어 등록정보에 표시된 앱 또는 개발자 이름을 언급해야 합니다."
google.closed-testing:
  title: "새 개인 Play 계정에는 비공개 테스트가 필요합니다"
  summary: "2023년 11월 13일 이후 만든 개인 Play Console 계정은 프로덕션에 접근하기 전에 최소 12명의 테스터가 14일 동안 계속 참여한 비공개 테스트를 진행해야 합니다. 조직 계정은 이 요건의 대상이 아닙니다. 계정 유형은 확인 진술에 따릅니다."
iab.app-ads:
  title: "광고가 있는 앱은 app-ads.txt 파일을 게시합니다"
  summary: "IAB Tech Lab의 app-ads.txt 1.0은 앱용 ads.txt 표준입니다. ads.txt 1.1은 OWNERDOMAIN과 MANAGERDOMAIN을 추가합니다. 이 검사는 선언된 개발자 웹사이트의 루트에서 app-ads.txt를 요청합니다. 판매자 ID를 지어내지 않습니다."
policy.ads-disclosure:
  title: "광고가 있는 앱의 개인정보 페이지는 광고를 언급해야 합니다"
  summary: "개인정보 처리방침은 수집한 데이터의 용도를 설명해야 하며, 광고 네트워크와 공유한다면 그것도 포함됩니다. 광고 SDK가 있는데 가져온 처리방침이 광고를 전혀 언급하지 않으면 위험이며, 차단 요소는 아닙니다."
kvkk.disclosure:
  title: "개인정보 페이지의 KVKK 제10조 고지 항목"
  summary: "개인정보를 취득할 때 처리자는 최소한 처리자의 신원, 목적, 데이터를 받는 자와 그 이유, 수집 방법과 법적 근거, 제11조의 권리를 정보주체에게 알려야 합니다. 지침은 이를 위한 전자적 수단의 하나로 모바일 앱을 들고 있습니다. 키워드 일치는 법률 의견이 아닙니다."
kvkk.consent-separate:
  title: "명시적 동의와 고지문은 별도 단계입니다"
  summary: "처리가 명시적 동의에 근거하는 경우 고지 의무와 명시적 동의 수집은 따로 이루어집니다. 이 검사는 앱에 명시적 동의가 필요한지 판단하지 않습니다. 프로젝트의 답변을 사용합니다."
  next: ".launchymind/project.yaml에서 kvkk.explicitConsent를 설정하고, 그 값이 true이면 kvkk.consentSeparate도 설정하세요. README의 예시를 참고하세요."
apple.privacy-manifest-tracking:
  title: "광고나 추적은 개인정보 보호 매니페스트의 추적 항목과 일치해야 합니다"
  summary: "광고를 표시하거나 추적을 요청하는 앱은 앱 수준의 개인정보 보호 매니페스트가 있어야 하며, 그 NSPrivacyTracking 플래그는 추적에 사용된다고 표시한 수집 데이터 유형과, 추적이 켜져 있을 때는 추적 도메인과 일치해야 합니다. 불일치는 위험이며 거부가 확정된 것은 아닙니다."
  next: "앱의 PrivacyInfo.xcprivacy를 여세요. 추적한다면 NSPrivacyTracking을 true로 설정하고 추적 도메인을 나열하세요. 수집 데이터 유형이 추적으로 표시되어 있다면 추적 플래그를 false로 두면 안 됩니다."
apple.stub-purchase-ui:
  title: "구매 SDK 없이 임시 구매 또는 구매 복원 문구가 있습니다"
  summary: "가이드라인 2.1(a)에 따르면 제출물은 최종본이어야 하고 임시 텍스트는 제거해야 합니다. 구매 SDK가 없는데 구매 복원이나 임시 구매 문구가 있고 그 문구가 화면에 나타날 수 있다면 위험입니다. const false 플래그로 막혀 있다면 관찰 사항일 뿐입니다."
  next: "임시 문구를 제거하거나, 실제 구매 SDK를 연결할 때까지 const false 플래그 뒤에 두세요."
google.sample-ad-id:
  title: "Google 샘플 광고 단위 ID가 출시 버전에 포함되면 안 됩니다"
  summary: "Google은 테스트용으로 게시자 ID ca-app-pub-3940256099942544의 샘플 광고 단위를 공개합니다. 이 ID가 디버그 분기로 명확하게 제한되지 않은 채 Info.plist, Android 매니페스트 또는 Dart에 있으면 위험입니다."
  next: "샘플 ID는 kDebugMode 또는 kReleaseMode 조건 안에 두고, plist와 매니페스트에는 자신의 광고 단위 ID를 넣어 출시하세요."
google.ump-consent-call:
  title: "광고가 있는 앱은 UMP 동의 정보 업데이트를 요청해야 합니다"
  summary: "Google의 AdMob EU 동의 가이드에 따르면 일부 지역에서는 동의가 필요하므로 앱 실행 시 사용자 메시지 동의 정보 업데이트를 요청해야 합니다. 광고 SDK가 있는데 lib/에 requestConsentInfoUpdate, ConsentInformation 또는 UserMessagingPlatform 호출이 없으면 위험입니다."
  next: "광고를 로드하기 전에 ConsentInformation.instance.requestConsentInfoUpdate를 호출하고, Google이 요구하는 곳에는 개인정보 보호 옵션 진입점을 두세요."
product.kids-policy-consistency:
  title: "아동 대상이 아니라는 처리방침은 아동 대상 답변과 일치해야 합니다"
  summary: "가져온 개인정보 페이지에 앱이 아동을 대상으로 하지 않는다고 되어 있다면 audience.kids는 yes가 아니어야 합니다. 답변이 없으면 페이지와 프로젝트 파일을 맞출 수 있도록 미확인으로 남깁니다."
  next: "페이지가 맞다면 .launchymind/project.yaml에 audience.kids: false를 설정하세요. 앱이 아동용이라면 페이지를 수정하고 스토어의 연령 등급 질문에 답하세요."
google.ad-id-permission:
  title: "Android 광고에는 광고 ID 권한이 필요합니다"
  summary: "Android 13에서는 광고 ID를 사용하는 앱에 AD_ID 권한이 필요합니다. SDK 라이브러리 매니페스트에서 선언한 권한은 병합됩니다. google_mobile_ads는 play-services-ads에 의존하므로, 앱 매니페스트에서 권한을 제거하지 않는 한 이 종속 항목이 인정됩니다."
  next: "com.google.android.gms.permission.AD_ID를 선언하거나, google_mobile_ads를 유지하고 권한을 제거하지 마세요. android/app/build 아래에 병합된 매니페스트가 있으면 그것도 읽습니다."
google.data-safety-ad-id:
  title: "광고를 사용하면 데이터 보안에 광고 ID가 포함되어야 합니다"
  summary: "Play의 데이터 보안 섹션에 따르면 Android 광고 ID는 기기 또는 기타 ID로 신고해야 합니다. Play Console을 조회하지 않았으므로 프로젝트 답변 google.data-safety-ad-id를 사용합니다."
  next: "데이터 보안 섹션에 광고 ID를 포함한 뒤 .launchymind/project.yaml에 attestations.google.data-safety-ad-id: true를 설정하세요."
store.ios.name-length:
  title: "App Store 이름은 2~30자입니다"
  summary: "App Store Connect에 따르면 현지화된 앱 이름은 2자 이상 30자 이하여야 합니다. 로컬 name.txt만 읽습니다."
store.ios.subtitle-length:
  title: "App Store 부제는 30자 이하입니다"
  summary: "앱 이름 아래의 부제는 30자를 넘을 수 없습니다. 부제 파일이 없는 프로젝트는 실패하지 않습니다."
store.ios.description-length:
  title: "App Store 설명은 4000자 이하입니다"
  summary: "App Store 설명은 4000자로 제한되며 일반 텍스트여야 합니다. 로컬 설명 파일의 글자 수를 셉니다."
store.ios.keywords-length:
  title: "App Store 키워드는 100바이트 이내입니다"
  summary: "키워드는 최대 100바이트입니다. App Store Connect 참고 자료가 바이트 단위로 세므로 이 검사도 바이트 단위로 셉니다."
store.ios.promo-length:
  title: "프로모션 텍스트는 170자 이하입니다"
  summary: "프로모션 텍스트는 170자를 넘을 수 없습니다. 선택 항목이므로 파일이 없어도 실패가 아닙니다."
store.ios.release-notes-length:
  title: "새로운 기능 텍스트는 4000자 이하입니다"
  summary: "이 버전의 새로운 기능은 4000자로 제한됩니다. 로컬 릴리스 노트 파일이 없으면 이 검사는 실행되지 않습니다."
store.play.title-length:
  title: "Play 제목은 30자 이하입니다"
  summary: "Play Console은 앱 이름을 30자로 제한하며, 전각 문자와 반각 문자를 각각 한 글자로 셉니다."
store.play.short-description-length:
  title: "Play 간단한 설명은 80자 이하입니다"
  summary: "Play의 간단한 설명은 80자로 제한됩니다. 로컬의 간단한 설명 파일을 측정합니다."
store.play.full-description-length:
  title: "Play 자세한 설명은 4000자 이하입니다"
  summary: "Play의 자세한 설명은 4000자까지 허용됩니다. 로컬의 자세한 설명 파일의 글자 수를 셉니다."
store.placeholder-text:
  title: "스토어 등록정보 텍스트가 임시 문구가 아닙니다"
  summary: "가이드라인 2.1(a)에 따르면 제출 전에 임시 텍스트와 기타 임시 콘텐츠를 제거해야 합니다. 로컬 등록정보에 Lorem ipsum, TODO, TBD가 있으면 실패입니다."
store.ios.other-platform:
  title: "iOS 등록정보에 다른 모바일 플랫폼 이름이 없습니다"
  summary: "가이드라인 2.3.10은 앱이나 메타데이터에 다른 모바일 플랫폼이나 대체 마켓플레이스의 이름을 포함하지 말라고 합니다."
store.play.other-platform:
  title: "Play 등록정보가 다른 모바일 플랫폼을 내세우지 않습니다"
  summary: "Play는 설명이 앱을 정확하게 설명해야 한다고 합니다. Play 등록정보에서 iPhone, iPad, iOS 또는 App Store를 언급하는 것은 위험이며 자동 거부는 아닙니다."
store.future-promise:
  title: "등록정보 텍스트가 없는 기능을 약속하지 않습니다"
  summary: "가이드라인 2.3.7은 부제에 검증할 수 없는 제품 주장을 넣지 말라고 합니다. 곧 출시, 추가될 예정 같은 표현은 프로모션 텍스트 밖에서 표시됩니다. 프로모션 텍스트에서는 Apple이 예정된 기능을 언급하도록 허용합니다."
store.copyright-year:
  title: "저작권 연도가 미래가 아닙니다"
  summary: "Apple은 저작권 항목이 권리를 얻은 연도로 시작한다고 합니다. 스캔한 해보다 뒤의 연도는 그 연도일 수 없습니다. 이전 연도는 잘못된 것으로 보지 않습니다."
store.price-claims:
  title: "등록정보 텍스트에 페이지가 이미 보여 주는 가격을 덧붙이지 않습니다"
  summary: "가이드라인 2.3.7은 메타데이터를 가격 정보로 채우지 말라고 합니다. Play도 제목에서 무료나 할인율 같은 혜택을 홍보해서는 안 된다고 합니다."
store.keyword-stuffing:
  title: "키워드가 반복되거나 다른 브랜드로 채워지지 않았습니다"
  summary: "가이드라인 2.3.7은 키워드를 상표 용어, 인기 앱 이름, 관련 없는 문구로 채우지 말라고 합니다. 반복된 키워드나 소수의 다른 제품 이름은 위험이며, 그 자체로 거부되지는 않습니다."
store.locale-consistency:
  title: "영어와 터키어 등록정보가 같은 기능을 언급합니다"
  summary: "Apple은 메타데이터를 언어별로 현지화합니다. 영어와 터키어 설명이 모두 있을 때 한쪽에만 있는 기능 단어는 위험입니다. 디스크에 한 언어만 있으면 다른 언어는 미확인으로 남습니다."
store.urls-reachable:
  title: "스토어 등록정보에 적힌 URL이 열립니다"
  summary: "가이드라인 2.1(a)에 따르면 제출물에는 완전히 작동하는 URL이 있어야 합니다. 등록정보의 URL은 온라인 스캔일 때만 가져옵니다. 오프라인에서는 미확인으로 남습니다."
store.ios.icon:
  title: "App Store 아이콘은 1024×1024이며 알파가 없습니다"
  summary: "iOS용 Xcode의 App Store 아이콘 칸은 1024×1024 이미지입니다. App Store Connect는 투명하거나 알파 채널이 있는 아이콘을 거부합니다. 크기를 잴 수 없는 파일은 미확인으로 남습니다."
store.ios.screenshots:
  title: "스크린샷이 대상 기기에 필요한 크기와 맞습니다"
  summary: "App Store Connect는 프로젝트가 iPad 전용이 아닌 한 Dynamic Island가 있는 iPhone 스크린샷을 요구하며, iPad 전용이면 13인치 iPad 크기가 필요합니다. 스크린샷에는 알파 채널이 있으면 안 됩니다. 크기별로 최대 10장까지 허용됩니다. 사양 목록에 없는 크기나 기기 제품군을 읽지 못한 세트는 미확인으로 남습니다."
store.play.icon:
  title: "Play 아이콘은 512×512 PNG입니다"
  summary: "Play는 알파가 있는 512×512, 32비트 PNG 아이콘을 요구하며, 파일은 1024KB 이하여야 합니다. 읽을 수 없는 파일은 미확인으로 남습니다."
store.play.feature-graphic:
  title: "Play 그래픽 이미지는 1024×500이며 알파가 없습니다"
  summary: "Play는 알파가 없는 JPEG 또는 24비트 PNG 형식의 1024×500 그래픽 이미지를 요구합니다. 읽을 수 없는 파일은 미확인으로 남습니다."
store.play.screenshots:
  title: "Play 휴대전화 스크린샷이 게시된 크기와 개수를 충족합니다"
  summary: "Play는 스크린샷을 최소 2장, 최대 8장 요구합니다. 각 변은 320~3840픽셀이어야 하고, 긴 변은 짧은 변의 2배 이하이며, 알파가 없어야 합니다. 크기를 잴 수 없는 파일은 미확인으로 남습니다."
artifact.drift:
  title: "빌드 결과물이 소스에서 읽은 값과 일치합니다"
  summary: "IPA, APK 또는 AAB를 프로젝트와 함께 스캔하면 targetSdk, AD_ID 권한, 앱 개인정보 보호 매니페스트의 추적 플래그, 카메라 사용 문구를 비교합니다. 차이가 있으면 위험입니다. 결과물에 들어 있지 않은 값은 미확인으로 남습니다."
sdk.manifest-label-mismatch:
  title: "확인된 SDK 공개 내용이 개인정보 보호 매니페스트와 다릅니다"
  summary: "Apple은 개인정보 답변에 앱에 코드가 포함된 서드파티 파트너도 넣어야 한다고 합니다. 이 지식 베이스를 위해 연 공급업체 페이지에 SDK가 데이터를 서드파티 광고에 사용할 수 있다고 되어 있는데 앱 개인정보 보호 매니페스트에서 NSPrivacyTracking이 false라면, 그 불일치는 위험입니다. 알 수 없는 SDK는 행을 추가하지 않습니다."
sdk.answer-label-mismatch:
  title: "확인된 SDK 공개 내용이 프로젝트 답변과 다릅니다"
  summary: "Play는 SDK 데이터도 데이터 보안 섹션에 포함된다고 합니다. 프로젝트가 광고 ID를 신고하지 않았다고 답했는데 확인된 SDK 행에 기기 ID나 광고 ID가 있다면, 그 불일치는 위험입니다. 비어 있는 답변은 미확인으로 남습니다."
apple.restore-purchases:
  title: "복원 가능한 앱 내 구입에는 복원 기능이 필요합니다"
  summary: "가이드라인 3.1.1은 복원 가능한 모든 앱 내 구입에 복원 메커니즘을 갖추라고 하며, Apple의 구독 페이지는 가입 화면에 기존 구독자가 로그인하거나 구입을 복원할 방법이 있어야 한다고 합니다. 이 검사는 소스에서 restorePurchases 호출이나 구입 복원 레이블, 또는 확인 진술을 찾습니다."
  next: "SDK의 복원 메서드(RevenueCat: Purchases.restorePurchases())를 호출하는 구입 복원 버튼을 추가하거나, .launchymind/project.yaml에 attestations.payments.restore-control을 설정하세요."
apple.subscription-paywall-links:
  title: "구독 가입에는 이용 약관과 개인정보 처리방침 링크가 필요합니다"
  summary: "Apple의 자동 갱신 구독 페이지는 가입 화면에 들어가야 할 것을 나열합니다. 구독 이름과 기간, 전체 갱신 가격, 구입을 복원하는 방법입니다. 또한 앱과 App Store 메타데이터에 이용 약관과 개인정보 처리방침 링크가 있어야 한다고 합니다. 이 검사는 소스에서 이용 약관 또는 EULA 문구와 앱 내 개인정보 URL, 또는 확인 진술을 찾습니다."
  next: "페이월에 이용 약관(또는 Apple 표준 EULA)과 개인정보 처리방침 링크를 넣거나, 직접 확인한 뒤 attestations.payments.paywall-links를 설정하세요."
google.subscription-offer-terms:
  title: "Play 정기 결제는 가격, 결제 주기, 자동 갱신을 공개해야 합니다"
  summary: "Google Play의 정기 결제 정책에 따르면 혜택 조건, 정기 결제 비용, 결제 주기, 자동 갱신 조건, 앱 사용에 정기 결제가 필요한지 여부를 명확하고 분명하게 공개해야 합니다. 이 검사는 소스에서 가격, 결제 주기, 자동 갱신 문구 또는 구독 조건 확인 진술을 찾습니다."
  next: "구독 버튼 옆에 가격, 결제 주기, 자동 갱신된다는 사실을 표시하거나, 페이월을 직접 검토한 뒤 attestations.apple.subscription-terms를 설정하세요."
revenuecat.secret-key-in-app:
  title: "RevenueCat 비밀 API 키가 앱에 포함되면 안 됩니다"
  summary: "RevenueCat에 따르면 비밀 API 키는 sk_로 시작하고, 기밀로 유지해야 하며, 자체 서버에만 저장해야 합니다. SDK는 공개 SDK 키로 설정합니다. 앱 소스에서 sk_로 시작하는 문자열 리터럴을 검색했습니다. 공개 SDK 키는 문제없습니다."
  next: "앱에서 sk_ 키를 제거하고 RevenueCat 대시보드에서 폐기한 뒤, 앱별 공개 키로 SDK를 설정하세요."
revenuecat.products-configured:
  title: "RevenueCat 상품과 오퍼링이 코드와 일치합니다"
  summary: "REVENUECAT_API_KEY가 설정되어 있으면 LaunchyMind는 RevenueCat REST API v2(읽기 전용)에서 상품, 엔타이틀먼트, 오퍼링을 읽고, 상품의 스토어 식별자를 코드에 적힌 상품 ID와 비교합니다. 키가 없으면 이 규칙은 실행되지 않습니다."
  next: "빠진 상품을 RevenueCat에 추가해 엔타이틀먼트와 오퍼링에 연결하거나, 코드의 상품 ID를 고치세요."
google.data-safety-declaration-sdks:
  title: "로컬 데이터 보안 신고가 SDK가 수집하는 항목을 포함합니다"
  summary: "Google은 데이터 보안 섹션에 앱에서 사용하는 라이브러리와 SDK가 기기 밖으로 전송하는 사용자 데이터도 포함해야 한다고 합니다. 데이터 보안용 Play API는 쓰기 전용이므로 LaunchyMind는 프로젝트의 launchymind.datasafety.json을 확인된 SDK 행이 가리키는 Play 데이터 유형과 비교합니다. Play 유형이 명확하지 않은 행은 수동 매핑용으로 나열되며 실패하지 않습니다."
  next: "빠진 데이터 유형을 launchymind.datasafety.json과 Play Console의 데이터 보안 섹션에 추가하거나, 내 설정에서는 수집하지 않는다는 것을 SDK 공급업체에 확인하세요."
build.native-build:
  title: "요청한 네이티브 빌드가 실행되었고 결과물을 읽었습니다"
  summary: "scan --build를 사용하면 LaunchyMind는 프로젝트의 임시 사본에서 디버그 APK와 iOS 시뮬레이터 앱을 빌드한 뒤 스캔한 결과물처럼 읽습니다. 실패한 빌드는 위험입니다. 도구 모음이 없어 실행되지 않은 빌드는 미확인으로 남으며, 절대 통과가 아닙니다."
  next: "보고서의 빌드 로그 줄을 읽고 빌드를 고친 뒤 scan --build를 다시 실행하세요. 빌드가 실행되지 않은 곳에는 Flutter, JDK 또는 Xcode를 설치하세요."
apple.launch-crash:
  title: "iOS 빌드가 시뮬레이터에서 충돌 없이 시작됩니다"
  summary: "가이드라인 2.1에 따르면 Apple은 충돌하거나 명백한 기술적 문제가 있는 바이너리를 거부합니다. launchymind run 또는 scan --live를 사용하면 부팅된 시뮬레이터에 IPA를 설치하고 실행하며, 몇 초 뒤에도 앱이 실행 중이어야 합니다. Xcode나 부팅된 시뮬레이터가 없으면 미확인으로 남습니다."
  next: "시뮬레이터 충돌 보고서나 Xcode 콘솔을 열어 충돌을 고친 뒤 검사를 다시 실행하세요."
google.launch-crash:
  title: "Android 빌드가 기기에서 충돌 없이 시작됩니다"
  summary: "Google Play의 최소 기능 정책은 충돌, 강제 종료, 멈춤 등 비정상적으로 작동하는 앱을 허용하지 않는다고 합니다. launchymind run 또는 scan --live를 사용하면 adb로 APK를 설치하고 실행하며, 몇 초 뒤에도 프로세스가 실행 중이어야 하고 충돌 로그에 앱 이름이 나오지 않아야 합니다. adb나 연결된 기기가 없으면 미확인으로 남습니다."
  next: "증거의 충돌 줄을 읽거나 adb logcat -b crash를 실행하고, 충돌을 고친 뒤 검사를 다시 실행하세요."
legal.accessibility.element-labels:
  title: "상호작용 요소에는 접근성 레이블이 있어야 합니다"
  summary: "Android 접근성 가이드는 각 UI 요소의 목적 설명을 보통 contentDescription에 넣으라고 하며, Apple의 VoiceOver 평가 기준은 화면의 중요한 항목에 VoiceOver가 읽을 수 있는 레이블이나 설명이 있어야 한다고 합니다. 이 검사는 소스에서 레이블 API(Semantics, semanticLabel, accessibilityLabel, aria-label, contentDescription)만 찾습니다. 하나를 찾았다고 모든 요소에 레이블이 있다는 뜻은 아닙니다."
  next: "아이콘 버튼과 이미지에 레이블을 붙이고(Flutter Semantics 또는 semanticLabel, React Native accessibilityLabel, SwiftUI .accessibilityLabel, Android contentDescription) VoiceOver와 TalkBack으로 테스트하세요."
legal.accessibility.nutrition-labels-answered:
  title: "App Store 손쉬운 사용 영양 레이블을 검토했습니다"
  summary: "Apple에 따르면 손쉬운 사용 영양 레이블(Accessibility Nutrition Labels)은 처음에는 선택 사항이지만, 시간이 지나면 새 앱과 업데이트를 제출할 때 손쉬운 사용 지원 정보를 공유해야 합니다. 이 검사는 프로젝트가 attestations.apple.accessibility-labels에 답했는지만 묻습니다. 현재는 어느 답이든 통과합니다."
legal.accessibility.eaa-scope-answered:
  title: "유럽 접근성법이 앱에 적용되는지에 답했습니다"
  summary: "제2조 제2항은 2025년 6월 28일 이후 소비자에게 제공되는 서비스 중 지침이 적용되는 것을 나열합니다. 전자 통신, 시청각 미디어 접근, 여객 운송 모바일 앱, 소비자 은행 서비스, 전자책, 전자 상거래 등입니다. 제4조 제5항은 서비스를 제공하는 소기업을 면제합니다. 많은 게임은 이 목록에 들지 않습니다. 이 검사는 프로젝트가 attestations.eaa.applies에 답했는지만 묻습니다. 적용 범위를 결정하지 않으며 법률 자문이 아닙니다."
legal.accessibility.eaa-information:
  title: "적용 대상 서비스가 접근성 정보를 공개합니다"
  summary: "제13조에 따르면 서비스 제공자는 접근성 요건에 따라 서비스를 설계하고 제공하며, 부속서 V의 정보를 준비하고, 서비스가 요건을 어떻게 충족하는지 설명하고, 그 정보를 접근 가능한 방식으로 공개합니다. 이 검사는 프로젝트가 이 법이 적용된다고 답한 경우에만 실행되며, 그 정보가 공개되었는지(attestations.eaa.information) 묻습니다. 법률 자문이 아닙니다."
legal.apple.kids-parental-gate:
  title: "키즈 카테고리의 구매와 외부 링크가 자녀 보호 게이트 뒤에 있습니다"
  summary: "가이드라인 1.3에 따르면 키즈 카테고리 앱은 자녀 보호 게이트 뒤의 지정 영역에 한정하지 않는 한 앱 외부 링크, 구매 기회, 기타 아이의 주의를 빼앗는 요소를 포함해서는 안 됩니다. 이 앱에는 구매가 있습니다. 이 검사는 구매 흐름이 자녀 보호 게이트 뒤에 있다고 프로젝트가 진술했는지(attestations.apple.kids-parental-gate) 묻습니다."
legal.apple.kids-third-party-analytics:
  title: "키즈 카테고리 앱에는 서드파티 분석을 포함하지 않아야 합니다"
  summary: "가이드라인 1.3과 5.1.4는 키즈 카테고리 앱에 서드파티 분석을 포함하지 말라고 합니다. 서비스가 IDFA나 아동, 아동의 위치 또는 기기에 관한 식별 가능한 정보를 수집하거나 전송하지 않는다면 제한적으로 허용될 수 있습니다. 종속 항목에 분석 SDK가 있습니다. 프로젝트가 예외에 해당한다고 진술하지 않으면(attestations.apple.kids-analytics-exception) 검사는 실패합니다."
legal.coppa.notice-answered:
  title: "COPPA 고지 질문에 답이 있습니다"
  summary: "16 CFR 312.3에 따르면 아동 대상 서비스 운영자는 일반적으로 아동의 개인정보를 수집하기 전에 고지를 제공하고 검증 가능한 부모 동의를 받아야 합니다. 이 검사는 고지 단계를 마쳤다고 프로젝트가 답했는지만 기록합니다. 앱이 아동 대상이라고 판단하지 않으며 법률 자문이 아닙니다."
legal.dsa.trader-answered:
  title: "EU 거래자 여부에 답했습니다"
  summary: "Apple에 따르면 DSA 제30조와 제31조에 따라 Apple은 거래자 연락처 정보를 수집해야 하며, 개발자가 거래자인지는 Apple이 판단할 수 없습니다. 이 검사는 프로젝트가 예 또는 아니요로 답하기만 요구합니다. 거래자 여부를 결정하지 않으며 법률 자문이 아닙니다."
legal.gdpr.notice-contents:
  title: "개인정보 처리방침에 제13조 정보가 있어야 합니다"
  summary: "제13조는 개인정보를 수집할 때 컨트롤러가 제공해야 하는 것을 나열합니다. 컨트롤러의 신원과 연락처, 목적과 법적 근거, 수령인, 제3국 이전, 보관 기간, 정보주체의 권리, 감독기관에 민원을 제기할 권리입니다. 이 검사는 게시된 개인정보 페이지에서 각 항목의 문구를 찾습니다. 문구 일치일 뿐 법률 검토가 아니며 법률 자문도 아닙니다."
  next: "개인정보 처리방침에 빠진 제13조 항목을 추가하세요. 컨트롤러와 연락처, 목적과 법적 근거, 수령인, 제3국 이전, 보관 기간, 권리, 민원을 제기할 권리입니다."
legal.gdpr.lawful-basis-answered:
  title: "처리 목적별 법적 근거를 기록했습니다"
  summary: "제6조 제1항은 나열된 근거 중 최소 하나가 적용될 때만 처리가 적법하다고 하며, 제13조 제1항 (c)는 법적 근거를 정보주체에게 알리도록 요구합니다. 이 검사는 목적별로 근거를 골랐다고 프로젝트가 기록했는지(attestations.gdpr.lawful-basis)만 묻습니다. 근거를 고르지 않으며 법률 자문이 아닙니다."
legal.gdpr.consent-withdrawal:
  title: "동의가 근거라면 처리방침이 철회 방법을 설명합니다"
  summary: "제7조 제3항은 정보주체에게 언제든 동의를 철회할 권리를 주고, 동의 전에 그 사실을 알려야 하며, 철회는 동의만큼 쉬워야 한다고 합니다. 이 검사는 일부 처리가 동의에 근거한다고 프로젝트가 말하거나 앱이 동의 양식(UMP)을 요청할 때 실행됩니다. 게시된 개인정보 페이지에서 철회 문구를 찾습니다. 법률 자문이 아닙니다."
legal.gdpr.erasure-path:
  title: "계정이 있는 사용자가 삭제를 요청할 방법이 있습니다"
  summary: "제17조는 해당 사유 중 하나가 적용될 때 정보주체가 부당한 지체 없이 개인정보 삭제를 받을 권리를 주며, 제13조 제2항 (b)는 그 권리가 있음을 알리도록 요구합니다. 앱에 계정이 있으면 이 검사는 앱 내 삭제 경로나 선언된 계정 삭제 URL을 찾습니다. 어떤 사유가 적용되는지 판단하지 않으며 법률 자문이 아닙니다."
legal.gdpr.processors-answered:
  title: "서드파티 SDK의 프로세서 조건을 기록했습니다"
  summary: "제28조는 컨트롤러가 충분한 보장을 제공하는 프로세서만 이용할 수 있고, 프로세서의 처리는 계약이나 기타 법률 행위로 규율된다고 합니다. 이 앱에는 광고, 분석, 추적, 알림 또는 결제 SDK가 있습니다. 이 검사는 각 공급업체의 역할과 조건을 검토했다고 프로젝트가 기록했는지(attestations.gdpr.processors) 묻습니다. 일부 SDK 공급업체는 프로세서가 아니라 독립 컨트롤러로 행동하며, 이는 개발자가 판단할 일입니다. 법률 자문이 아닙니다."
legal.gdpr.transfers-disclosed:
  title: "EU 또는 EEA 밖으로의 이전이 공개되어 있습니다"
  summary: "제44조는 제5장의 조건에서만 제3국 이전을 허용하며, 제13조 제1항 (f)는 예정된 이전과 적정성 결정 또는 보호 조치를 정보주체에게 알리도록 요구합니다. 이 앱은 서드파티 SDK를 포함합니다. 이 검사는 게시된 개인정보 페이지의 이전 관련 문구나 이전이 없다는 프로젝트 진술(attestations.gdpr.transfers)을 찾습니다. 법률 자문이 아닙니다."
legal.google.families-ad-id:
  title: "아동 대상 Play 앱은 광고 ID를 유지하지 않아야 합니다"
  summary: "가족 정책에 따르면 아동만을 대상으로 하는 앱은 Android API 33 이상에서 AD_ID 권한을 요청하지 않아야 하며, 아동의 광고 ID를 전송해서는 안 됩니다. 프로젝트 답변만으로는 앱이 아동만을 대상으로 한다고 증명되지 않으므로, 이는 거부가 아니라 위험이며 법률 자문도 아닙니다."
legal.kvkk.consent-answered:
  title: "KVKK 명시적 동의 질문에 답해야 합니다"
  summary: "근거는 고지 의무에 관한 KVKK 고시입니다. 이 검사는 프로젝트가 kvkk.explicitConsent에 답했는지만 묻습니다. 처리에 동의가 필요하다고 판단하지 않으며 법률 자문이 아닙니다."
