apple.privacy-policy-in-app:
  summary: "Le code de l'app ne contient pas encore de lien vers la politique de confidentialité. La règle 5.1.1(i) en demande un dans l'app. Il manque un seul lien ; ce n'est pas un jugement sur le reste de l'app."
  next: "Ajoutez l'URL de confidentialité sur un écran accessible, comme les réglages, puis relancez l'analyse."
