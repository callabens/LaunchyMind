  - id: google.ad-id-permission
    title: Ads on Android need the advertising ID permission
    severity: risk
    platforms: [android]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.android.com/about/versions/13/behavior-changes-13
      section: "Permission required for advertising ID"
      publisher: Android
    summary:
      en: "Android 13 requires the AD_ID permission for apps that use an advertising ID. A permission declared by an SDK library manifest is merged in. google_mobile_ads depends on play-services-ads, so that dependency counts unless the app manifest removes the permission."
      tr: "Android 13, reklam kimliği kullanan uygulamalar için AD_ID iznini şart koşar. SDK manifestindeki izin birleşir. google_mobile_ads play-services-ads'e bağlıdır; uygulama manifesti izni kaldırmazsa bu bağımlılık sayılır."
    next:
      en: "Declare com.google.android.gms.permission.AD_ID, or keep google_mobile_ads and do not remove the permission. A merged manifest under android/app/build is also read when it exists."
      tr: "com.google.android.gms.permission.AD_ID bildirin ya da google_mobile_ads kalsın ve izni kaldırmayın. Varsa android/app/build altındaki birleşmiş manifest de okunur."
    appliesWhen:
      all:
        - { fact: platform.android, eq: true }
        - { fact: capability.ads, eq: true }
    evaluate:
      pass:
        any:
          - { fact: android.ad_id, eq: "declared" }
          - { fact: android.ad_id, eq: "merged-by-sdk" }
      fail:
        any:
          - { fact: android.ad_id, eq: "missing" }
          - { fact: android.ad_id, eq: "removed" }
    check:
      confidence: heuristic
      note: "The google_mobile_ads AndroidManifest.xml read on 2026-11-19 does not itself contain AD_ID. Its build.gradle depends on com.google.android.gms:play-services-ads:25.5.0. The AAR was not opened. tools:node=\"remove\" on the permission is a failure."

