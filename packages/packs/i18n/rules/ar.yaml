# Rule explanations (ar). Translated from the English rule texts; keep ids, file names, keys, and guideline numbers unchanged.
product.flutter-project:
  title: "المشروع من نوع يستطيع هذا الفاحص قراءته"
  summary: "يقرأ LaunchyMind مشاريع Flutter وReact Native وExpo وiOS الأصلية وAndroid الأصلية وUnity. المجلد الذي لا ينتمي إلى أي منها لا يحصل على حكم خاص بالمتجر. والمعلومة التي لا تظهرها الملفات تبقى غير متحقق منها."
product.audience-answers:
  title: "أسئلة عن الجمهور لا يستطيع الكود الإجابة عنها"
  summary: "لا يمكن قراءة ما يخص الأطفال والصحة والمحتوى الذي ينشئه المستخدمون من الكود بشكل موثوق. إلى أن يجيب ملف .launchymind/project.yaml عنها، تبقى هذه الموضوعات غير متحقق منها."
apple.kids-third-party:
  title: "ينبغي أن تتجنب التطبيقات الموجهة للأطفال الإعلانات والتحليلات من جهات خارجية"
  summary: "تقول Apple إن التطبيقات المخصصة أساسًا للأطفال لا ينبغي أن تتضمن تحليلات أو إعلانات من جهات خارجية. إجابة الجمهور هي تصريح المطوّر، وليست خانة فئة الأطفال."
apple.privacy-policy-in-app:
  title: "يحتاج التطبيق إلى رابط لسياسة الخصوصية داخل التطبيق"
  summary: "لا يحتوي مصدر التطبيق بعدُ على رابط لسياسة الخصوصية. يطلب الإرشاد 5.1.1(i) وجود رابط داخل التطبيق. هذا رابط واحد ناقص، وليس حكمًا بأن بقية التطبيق يجب التخلص منها."
  next: "أضف رابط الخصوصية في شاشة يستطيع المستخدمون فتحها، مثل الإعدادات، ثم أعد الفحص."
apple.privacy-policy-metadata:
  title: "رابط سياسة الخصوصية مُعلن لبيانات المتجر الوصفية"
  summary: "يطلب الإرشاد 5.1.1(i) أيضًا رابط سياسة الخصوصية في App Store Connect. لا يستطيع LaunchyMind رؤية App Store Connect. غياب الإعلان المحلي يعني أن النتيجة غير متحقق منها، وليس إخفاقًا."
  next: "إذا أردت تسجيل ذلك في المشروع، فعيّن urls.privacy في .launchymind/project.yaml. واتركه فارغًا إذا كان الرابط موجودًا في App Store Connect فقط."
apple.privacy-link-opens:
  title: "رابط سياسة الخصوصية يفتح"
  summary: "يجب أن يؤدي رابط الخصوصية داخل التطبيق وفي البيانات الوصفية إلى سياسة حقيقية. يطلب هذا الفحص الرابط الموجود في المشروع وينبّه إلى أخطاء HTTP والصفحات المؤقتة."
apple.privacy-policy-content:
  title: "نص السياسة يغطي الجمع والحذف والموافقة"
  summary: "يقول الإرشاد 5.1.1(i) إن السياسة يجب أن تحدد البيانات التي تُجمع وكيفية جمعها، وجميع استخداماتها، وحماية الجهات الخارجية لها، ومدة الاحتفاظ والحذف، وكيف يمكن للمستخدم سحب موافقته أو طلب الحذف. العثور على كلمات مفتاحية مؤشر تقريبي، وليس مراجعة للسياسة."
apple.support-contact:
  title: "يوجد رابط دعم أو وسيلة تواصل"
  summary: "يقول الإرشاد 1.5 إن المستخدمين يحتاجون إلى وسيلة للتواصل معك. إذا لم يكن في المشروع رابط دعم، فلا يستطيع LaunchyMind رؤية الحقل في App Store Connect، لذا تبقى النتيجة غير متحقق منها. والصفحة المُعلنة التي لا تفتح تُعالج في فحص منفصل."
  next: "أضف رابط دعم في التطبيق أو في project.yaml، أو تحقق بنفسك من حقل رابط الدعم في App Store Connect."
apple.support-link-quality:
  title: "صفحة الدعم تعرض وسيلة للتواصل"
  summary: "ينبغي أن تقدم صفحة الدعم وسيلة سهلة للتواصل. يبحث هذا الفحص عن عنوان بريد إلكتروني أو عبارة تواصل، ويرفض الصفحات المؤقتة."
apple.account-deletion:
  title: "إنشاء الحساب يتطلب حذف الحساب من داخل التطبيق"
  summary: "إذا كان التطبيق يتيح إنشاء حساب، فيجب أن يتيح أيضًا حذف الحساب من داخل التطبيق. يبحث هذا الفحص عن رموز الحذف أو رابط حذف داخل التطبيق، ولا يستطيع الحكم على سهولة العثور على هذا الخيار."
apple.tracking-permission:
  title: "التتبع يتطلب إفصاح App Tracking Transparency"
  summary: "يجب أن تحصل على إذن صريح عبر واجهات App Tracking Transparency البرمجية لتتبع المستخدمين. عند وجود SDK للإعلانات أو التتبع، يتطلب هذا الفحص NSUserTrackingUsageDescription."
apple.login-equivalent:
  title: "تسجيل الدخول عبر جهة خارجية يحتاج إلى خيار مكافئ"
  summary: "التطبيقات التي تستخدم تسجيل الدخول عبر جهة خارجية أو شبكة اجتماعية للحساب الرئيسي يجب أن تقدم أيضًا تسجيل دخول مكافئًا يقصر البيانات على الاسم والبريد الإلكتروني، ويتيح للمستخدم إخفاء بريده، ولا يجمع تفاعلاته مع التطبيق لأغراض إعلانية دون موافقة. تذكر Apple استثناءات لا يستطيع هذا الفحص رؤيتها."
apple.permission-camera:
  title: "استخدام الكاميرا يحتاج إلى نص غرض في iOS"
  summary: "يجب أن تصف نصوص الغرض استخدام البيانات بوضوح وبشكل كامل. وجود قدرة على استخدام الكاميرا دون NSCameraUsageDescription يؤدي إلى إخفاق هذا الفحص."
apple.permission-photos:
  title: "استخدام مكتبة الصور يحتاج إلى نص غرض في iOS"
  summary: "الوصول إلى مكتبة الصور يحتاج إلى نص غرض يصف الاستخدام. يكفي NSPhotoLibraryUsageDescription أو NSPhotoLibraryAddUsageDescription لاجتياز فحص الوجود."
apple.permission-location:
  title: "استخدام الموقع يحتاج إلى نص غرض في iOS"
  summary: "الوصول إلى الموقع يحتاج إلى نص غرض. تكفي مفاتيح الاستخدام أثناء استخدام التطبيق أو الاستخدام الدائم لاجتياز فحص الوجود."
apple.permission-microphone:
  title: "استخدام الميكروفون يحتاج إلى نص غرض في iOS"
  summary: "الوصول إلى الميكروفون يحتاج إلى NSMicrophoneUsageDescription يصف الاستخدام."
apple.permission-contacts:
  title: "استخدام جهات الاتصال يحتاج إلى نص غرض في iOS"
  summary: "الوصول إلى جهات الاتصال يحتاج إلى NSContactsUsageDescription يصف الاستخدام."
apple.privacy-manifest-reasons:
  title: "الواجهات البرمجية التي تتطلب سببًا في بيان الخصوصية تحتاج إلى رموز أسباب"
  summary: "منذ 1 مايو 2024، لا يقبل App Store Connect التطبيقات التي تستخدم واجهة برمجية تتطلب سببًا دون وصف السبب في بيان الخصوصية. لا يخفق هذا الفحص إلا عندما يذكر بيان في المشروع واجهة برمجية دون رمز سبب."
apple.listed-sdk-manifest:
  title: "حزم SDK الخارجية المدرجة تحتاج إلى بيانات الخصوصية الخاصة بها"
  summary: "تتطلب Apple بيان خصوصية لحزم SDK المدرجة المضمّنة في الإرسال. الإضافات الموجودة في جدول LaunchyMind ذي الإصدارات تأتي مع ملف PrivacyInfo.xcprivacy خاص بها، لذا لا تبقى غير متحقق منها. أما حزمة SDK مدرجة غير موجودة في ذلك الجدول فما زالت تحتاج إلى إقرار."
  next: "بالنسبة إلى حزمة SDK مدرجة غير موجودة في جدول البيانات المضمّنة، افحص الـ pod أو الحزمة، ولا تعيّن apple.listed-sdk-manifests إلا بعد أن ترى الملف."
apple.minimum-os:
  title: "يجب أن تستهدف التطبيقات المرفوعة iOS 13 أو أحدث"
  summary: "منذ 9 سبتمبر 2026، يجب أن تستهدف تطبيقات iOS وiPadOS المرفوعة إلى App Store Connect الإصدار iOS 13 أو أحدث."
apple.xcode-sdk:
  title: "يجب بناء التطبيقات المرفوعة باستخدام Xcode 26 وiOS 26 SDK"
  summary: "منذ 28 أبريل 2026، يجب بناء التطبيقات المرفوعة إلى App Store Connect باستخدام Xcode 26 أو أحدث مع SDK لنظام iOS 26 أو iPadOS 26 أو tvOS 26 أو visionOS 26 أو watchOS 26. لا يحتوي مصدر المشروع على إصدار Xcode، لذا يستخدم هذا الفحص إقرارًا صريحًا."
apple.age-rating:
  title: "يجب الإجابة عن أسئلة التصنيف العمري المحدّثة"
  summary: "كان يجب الإجابة عن أسئلة التصنيف العمري من Apple قبل 31 يناير 2026 لتجنب انقطاع عند إرسال التحديثات. لم يُستعلم من App Store Connect، لذا يستخدم هذا الفحص إقرارًا صريحًا."
apple.subscription-terms:
  title: "ينبغي أن تصف شاشة شراء الاشتراك العرض"
  summary: "قبل أن يطلب التطبيق من العميل الاشتراك، ينبغي أن يوضح بجلاء ما سيحصل عليه مقابل السعر. يبحث هذا الفحص عن كلمات الاشتراك والسعر، أو عن إقرار. ولا يقرأ الملحق 2 من اتفاقية المطوّر."
google.target-api:
  title: "يجب أن تستهدف التطبيقات الجديدة والتحديثات Android 16 (API 36)"
  summary: "اعتبارًا من 31 أغسطس 2026، يجب أن تستهدف التطبيقات الجديدة والتحديثات Android 16 (المستوى 36 من واجهة برمجة التطبيقات) أو أعلى، مع استثناءات حسب نوع الجهاز لا يكتشفها هذا الفاحص. وكان تاريخ التمديد في صفحة المساعدة يمتد حتى 1 نوفمبر 2026."
google.privacy-policy:
  title: "يتطلب Play رابطًا لسياسة الخصوصية"
  summary: "يقول Google Play إن كل مطوّر يجب أن يملأ قسم أمان البيانات، بما في ذلك التطبيقات التي لا تجمع أي بيانات للمستخدمين، وأن يقدم رابطًا لسياسة الخصوصية. لم يُستعلم من Play Console."
google.data-safety-form:
  title: "يجب ملء قسم أمان البيانات"
  summary: "يجب على جميع المطوّرين الذين لديهم تطبيق على Google Play ملء قسم أمان البيانات، وجمع البيانات بواسطة حزم SDK يُحتسب. التطبيقات الموجودة على مسار الاختبار الداخلي فقط مُعفاة. لم يُستعلم من Play Console، لذا يُستخدم هنا إقرار."
google.account-deletion:
  title: "إنشاء الحساب يحتاج إلى مسار داخل التطبيق ورابط ويب للحذف"
  summary: "إذا كان التطبيق يتيح للمستخدمين إنشاء حساب، يتطلب Google Play مسارًا داخل التطبيق لحذف الحساب ورابط ويب يستطيع المستخدمون من خلاله طلب الحذف. ويمكن أن يكون رابط داخل التطبيق إلى مورد الويب هذا هو المسار داخل التطبيق."
google.account-deletion-link:
  title: "يجب أن يفتح رابط حذف الحساب على الويب وأن يذكر اسم التطبيق"
  summary: "تقول Google إن رابط الويب يجب أن يُحمَّل، وأن يبقى مسار الحذف سهل العثور عليه، وأن يذكر اسم التطبيق أو المطوّر كما يظهر في بيانات المتجر."
google.closed-testing:
  title: "حسابات Play الشخصية الجديدة تحتاج إلى اختبار مغلق"
  summary: "يجب على حسابات Play Console الشخصية التي أُنشئت بعد 13 نوفمبر 2023 إجراء اختبار مغلق يشارك فيه 12 مختبِرًا على الأقل بشكل متواصل لمدة 14 يومًا قبل الوصول إلى الإنتاج. حسابات المؤسسات خارج هذا الشرط. نوع الحساب إقرار."
iab.app-ads:
  title: "تطبيقات الإعلانات تنشر ملف app-ads.txt"
  summary: "ملف app-ads.txt 1.0 من IAB Tech Lab هو معيار ads.txt للتطبيقات. ويضيف ads.txt 1.1 الحقلين OWNERDOMAIN وMANAGERDOMAIN. يطلب هذا الفحص ملف app-ads.txt من جذر موقع المطوّر المُعلن، ولا يختلق معرّفات بائعين."
policy.ads-disclosure:
  title: "ينبغي أن تذكر صفحة الخصوصية في تطبيق إعلانات موضوع الإعلانات"
  summary: "يجب أن تصف سياسة الخصوصية استخدامات البيانات المجمّعة، بما في ذلك مشاركتها مع شبكات الإعلانات عند حدوث ذلك. إذا وُجدت SDK للإعلانات ولم تذكر السياسة التي جُلبت الإعلانات أبدًا، فهذا خطر وليس عائقًا."
kvkk.disclosure:
  title: "عناصر الإفصاح وفق المادة 10 من KVKK في صفحة الخصوصية"
  summary: "عند الحصول على بيانات شخصية، يجب على المسؤول عن البيانات أن يخبر الشخص على الأقل بهوية المسؤول، والغرض، ومن يتلقى البيانات ولماذا، وطريقة الجمع والأساس القانوني، والحقوق الواردة في المادة 11. ويذكر الدليل تطبيقات الجوال بوصفها إحدى الوسائل الإلكترونية لذلك. العثور على كلمات مفتاحية ليس رأيًا قانونيًا."
kvkk.consent-separate:
  title: "الموافقة الصريحة ونص الإفصاح خطوتان منفصلتان"
  summary: "عندما تستند المعالجة إلى الموافقة الصريحة، يُنفَّذ واجب الإفصاح والحصول على الموافقة الصريحة بشكل منفصل. لا يقرر هذا الفحص ما إذا كان التطبيق يحتاج إلى موافقة صريحة، بل يستخدم إجابة المشروع."
  next: "في .launchymind/project.yaml عيّن kvkk.explicitConsent، وإذا كانت قيمته true فعيّن kvkk.consentSeparate أيضًا. راجع المثال في README."
apple.privacy-manifest-tracking:
  title: "ينبغي أن تتوافق الإعلانات أو التتبع مع حقول التتبع في بيان الخصوصية"
  summary: "التطبيق الذي يعرض إعلانات أو يطلب التتبع ينبغي أن يكون له بيان خصوصية على مستوى التطبيق، تتوافق فيه قيمة NSPrivacyTracking مع أنواع البيانات المجمّعة الموسومة بأنها تُستخدم للتتبع، ومع نطاقات التتبع عندما يكون التتبع مفعّلًا. عدم التوافق خطر، وليس رفضًا مؤكدًا."
  next: "افتح ملف PrivacyInfo.xcprivacy الخاص بالتطبيق. إذا كنت تتتبع المستخدمين، فعيّن NSPrivacyTracking على true واذكر نطاقات التتبع. وإذا كان نوع بيانات مجمّعة موسومًا للتتبع، فلا ينبغي أن تكون قيمة التتبع false."
apple.stub-purchase-ui:
  title: "نص شراء مؤقت أو استعادة مشتريات دون SDK للشراء"
  summary: "يقول الإرشاد 2.1(a) إن الإرسالات يجب أن تكون نهائية وإن النصوص المؤقتة يجب إزالتها. وجود نص لاستعادة المشتريات أو لشراء مؤقت دون SDK للشراء خطر عندما يمكن الوصول إلى هذا النص. أما إذا كان محجوبًا بعلم const false فهو مجرد ملاحظة."
  next: "أزل النص المؤقت، أو أبقه خلف علم const false إلى أن تربط SDK حقيقية للشراء."
google.sample-ad-id:
  title: "يجب ألا تُنشر معرّفات الوحدات الإعلانية التجريبية من Google"
  summary: "تنشر Google وحدات إعلانية تجريبية تحت معرّف الناشر ca-app-pub-3940256099942544 لأغراض الاختبار. وجود هذا المعرّف في Info.plist أو بيان Android أو كود Dart دون أن يكون مقصورًا بوضوح على فرع التصحيح خطر."
  next: "أبقِ المعرّف التجريبي خلف kDebugMode أو kReleaseMode، وانشر معرّفات وحداتك الإعلانية الخاصة في ملف plist والبيان."
google.ump-consent-call:
  title: "ينبغي أن تطلب تطبيقات الإعلانات تحديث موافقة UMP"
  summary: "يقول دليل AdMob من Google بشأن الموافقة في الاتحاد الأوروبي إن عليك طلب تحديث معلومات الموافقة عبر منصة مراسلة المستخدمين عند التشغيل، لأن الموافقة مطلوبة في بعض المناطق. وجود SDK للإعلانات دون استدعاء requestConsentInfoUpdate أو ConsentInformation أو UserMessagingPlatform في lib/ خطر."
  next: "استدعِ ConsentInformation.instance.requestConsentInfoUpdate قبل تحميل الإعلانات، وأبقِ مدخلًا لخيارات الخصوصية حيث تشترط Google ذلك."
product.kids-policy-consistency:
  title: "ينبغي أن تتوافق سياسة غير موجهة للأطفال مع إجابة الأطفال"
  summary: "عندما تقول صفحة الخصوصية التي جُلبت إن التطبيق غير موجه للأطفال، فلا ينبغي أن تكون قيمة audience.kids هي نعم. وتبقى الإجابة الغائبة غير متحقق منها حتى يمكن مواءمة الصفحة مع ملف المشروع."
  next: "إذا كانت الصفحة صحيحة، فعيّن audience.kids: false في .launchymind/project.yaml. وإذا كان التطبيق للأطفال، فعدّل الصفحة وأجب عن أسئلة التصنيف العمري في المتجر."
google.ad-id-permission:
  title: "الإعلانات على Android تحتاج إلى إذن المعرّف الإعلاني"
  summary: "يتطلب Android 13 إذن AD_ID للتطبيقات التي تستخدم معرّفًا إعلانيًا. والإذن الذي يعلنه بيان مكتبة SDK يُدمج. تعتمد google_mobile_ads على play-services-ads، لذا تُحتسب هذه التبعية ما لم يُزل بيان التطبيق الإذن."
  next: "أعلن com.google.android.gms.permission.AD_ID، أو أبقِ google_mobile_ads ولا تُزل الإذن. ويُقرأ أيضًا البيان المدمج تحت android/app/build إن وُجد."
google.data-safety-ad-id:
  title: "ينبغي أن يتضمن أمان البيانات المعرّف الإعلاني عند استخدام الإعلانات"
  summary: "يقول قسم أمان البيانات في Play إن المعرّف الإعلاني في Android يجب الإعلان عنه ضمن الجهاز أو المعرّفات الأخرى. لم يُستعلم من Play Console، لذا يُستخدم هنا جواب المشروع google.data-safety-ad-id."
  next: "عيّن attestations.google.data-safety-ad-id: true في .launchymind/project.yaml بعد أن يتضمن قسم أمان البيانات المعرّف الإعلاني."
store.ios.name-length:
  title: "اسم App Store بين 2 و30 حرفًا"
  summary: "يقول App Store Connect إن اسم التطبيق المترجم يجب ألا يقل عن حرفين ولا يزيد على 30 حرفًا. يُقرأ ملف name.txt المحلي فقط."
store.ios.subtitle-length:
  title: "العنوان الفرعي في App Store لا يتجاوز 30 حرفًا"
  summary: "لا يمكن أن يتجاوز العنوان الفرعي تحت اسم التطبيق 30 حرفًا. المشروع الذي لا يحتوي على ملف عنوان فرعي لا يخفق."
store.ios.description-length:
  title: "وصف App Store لا يتجاوز 4000 حرف"
  summary: "وصف App Store محدود بـ 4000 حرف ويجب أن يكون نصًا عاديًا. يُعدّ ملف الوصف المحلي."
store.ios.keywords-length:
  title: "الكلمات المفتاحية في App Store ضمن 100 بايت"
  summary: "يمكن أن تصل الكلمات المفتاحية إلى 100 بايت. يعدّ مرجع App Store Connect البايتات، وكذلك يفعل هذا الفحص."
store.ios.promo-length:
  title: "النص الترويجي لا يتجاوز 170 حرفًا"
  summary: "لا يمكن أن يتجاوز النص الترويجي 170 حرفًا. وهو اختياري، لذا فغياب الملف ليس إخفاقًا."
store.ios.release-notes-length:
  title: "نص الميزات الجديدة لا يتجاوز 4000 حرف"
  summary: "نص الميزات الجديدة في هذا الإصدار محدود بـ 4000 حرف. إذا لم يوجد ملف ملاحظات إصدار محلي فلا يُشغَّل هذا الفحص."
store.play.title-length:
  title: "عنوان Play لا يتجاوز 30 حرفًا"
  summary: "يحدّ Play Console اسم التطبيق بـ 30 حرفًا، ويُحتسب كل حرف كامل العرض أو نصف العرض حرفًا واحدًا."
store.play.short-description-length:
  title: "الوصف المختصر في Play لا يتجاوز 80 حرفًا"
  summary: "للوصف المختصر في Play حد أقصى 80 حرفًا. يُقاس ملف الوصف المختصر المحلي."
store.play.full-description-length:
  title: "الوصف الكامل في Play لا يتجاوز 4000 حرف"
  summary: "يسمح الوصف الكامل في Play بـ 4000 حرف. يُعدّ ملف الوصف الكامل المحلي."
store.placeholder-text:
  title: "نص بيانات المتجر ليس نصًا مؤقتًا"
  summary: "يقول الإرشاد 2.1(a) إن النصوص المؤقتة وغيرها من المحتوى المؤقت يجب إزالتها قبل الإرسال. وجود Lorem ipsum أو TODO أو TBD في بيانات محلية إخفاق."
store.ios.other-platform:
  title: "بيانات iOS لا تذكر منصة جوال أخرى"
  summary: "يقول الإرشاد 2.3.10 بعدم تضمين أسماء منصات جوال أخرى أو متاجر بديلة في التطبيق أو بياناته الوصفية."
store.play.other-platform:
  title: "بيانات Play لا تتمحور حول منصة جوال أخرى"
  summary: "يقول Play إن الوصف يجب أن يصف التطبيق بدقة. ذكر iPhone أو iPad أو iOS أو App Store في بيانات Play خطر، وليس رفضًا تلقائيًا."
store.future-promise:
  title: "نص البيانات لا يعد بميزة غير موجودة"
  summary: "يقول الإرشاد 2.3.7 إن العناوين الفرعية لا ينبغي أن تتضمن ادعاءات عن المنتج لا يمكن التحقق منها. تُنبَّه عبارات مثل قريبًا وستُضاف خارج النص الترويجي، الذي تسمح فيه Apple بذكر الميزات القادمة."
store.copyright-year:
  title: "سنة حقوق النشر ليست في المستقبل"
  summary: "تقول Apple إن حقل حقوق النشر يبدأ بالسنة التي اكتُسبت فيها الحقوق. والسنة اللاحقة لسنة الفحص لا يمكن أن تكون تلك السنة. أما السنة الأقدم فلا تُعامل على أنها خطأ."
store.price-claims:
  title: "نص البيانات لا يضيف سعرًا تعرضه الصفحة أصلًا"
  summary: "يقول الإرشاد 2.3.7 بعدم حشو البيانات الوصفية بمعلومات الأسعار. ويقول Play أيضًا إن العنوان لا ينبغي أن يروّج لعرض مثل مجاني أو نسبة خصم."
store.keyword-stuffing:
  title: "الكلمات المفتاحية غير مكررة وغير محشوة بعلامات تجارية أخرى"
  summary: "يقول الإرشاد 2.3.7 بعدم حشو الكلمات المفتاحية بمصطلحات تجارية مسجلة أو أسماء تطبيقات شهيرة أو عبارات لا صلة لها. الكلمة المفتاحية المكررة أو مجموعة صغيرة من أسماء منتجات أخرى خطر، وليست رفضًا بحد ذاتها."
store.locale-consistency:
  title: "البيانات الإنجليزية والتركية تذكر الميزات نفسها"
  summary: "تترجم Apple البيانات الوصفية لكل لغة على حدة. عند وجود وصف إنجليزي وآخر تركي، فإن كلمة ميزة موجودة في أحدهما فقط خطر. وعندما توجد لغة واحدة فقط على القرص، تبقى اللغة الأخرى غير متحقق منها."
store.urls-reachable:
  title: "الروابط المكتوبة في بيانات المتجر تفتح"
  summary: "يقول الإرشاد 2.1(a) إن الإرسالات يجب أن تتضمن روابط تعمل بالكامل. لا تُجلب روابط البيانات إلا عندما يكون الفحص متصلًا بالإنترنت. وفي وضع عدم الاتصال تبقى غير متحقق منها."
store.ios.icon:
  title: "أيقونة App Store بحجم 1024 × 1024 ودون قناة ألفا"
  summary: "خانة أيقونة App Store في Xcode لنظام iOS صورة بحجم 1024 × 1024. يرفض App Store Connect الأيقونة الشفافة أو التي تحتوي على قناة ألفا. والملف الذي لا يمكن قياسه يبقى غير متحقق منه."
store.ios.screenshots:
  title: "لقطات الشاشة بالحجم المطلوب للجهاز المستهدف"
  summary: "يتطلب App Store Connect لقطة شاشة لجهاز iPhone مزود بـ Dynamic Island، ما لم يستهدف المشروع iPad فقط، وفي هذه الحالة يلزم حجم iPad مقاس 13 بوصة. لا يمكن أن تحتوي لقطات الشاشة على قناة ألفا. ويُسمح بما يصل إلى 10 لقطات لكل حجم. والحجم غير الموجود في قائمة المواصفات، أو المجموعة التي لم تُقرأ فئة أجهزتها، يبقى غير متحقق منه."
store.play.icon:
  title: "أيقونة Play بصيغة PNG بحجم 512 × 512"
  summary: "يتطلب Play أيقونة PNG بعمق 32 بت وحجم 512 × 512 مع قناة ألفا، ويجب ألا يتجاوز حجم الملف 1024 كيلوبايت. والملف الذي تتعذر قراءته يبقى غير متحقق منه."
store.play.feature-graphic:
  title: "رسم الميزة في Play بحجم 1024 × 500 دون قناة ألفا"
  summary: "يتطلب Play رسم ميزة بحجم 1024 × 500 بصيغة JPEG أو PNG بعمق 24 بت دون قناة ألفا. والملف غير المقروء يبقى غير متحقق منه."
store.play.screenshots:
  title: "لقطات شاشة الهاتف في Play تستوفي الحجم والعدد المنشورين"
  summary: "يطلب Play لقطتي شاشة على الأقل وثماني لقطات على الأكثر. يجب أن يكون كل ضلع بين 320 و3840 بكسل، وألا يزيد الضلع الطويل على ضعف القصير، ودون قناة ألفا. والملف الذي لا يمكن قياسه يبقى غير متحقق منه."
artifact.drift:
  title: "الملف المبني يطابق القيم المقروءة من المصدر"
  summary: "عند فحص ملف IPA أو APK أو AAB بجانب المشروع، تُقارن قيمة targetSdk وإذن AD_ID وعلم التتبع في بيان خصوصية التطبيق ونص استخدام الكاميرا. أي اختلاف خطر. والقيمة التي لم يحتوها الملف المبني تبقى غير متحقق منها."
sdk.manifest-label-mismatch:
  title: "إفصاح SDK موثّق يتعارض مع بيان الخصوصية"
  summary: "تقول Apple إن إجابات الخصوصية يجب أن تشمل الشركاء من الجهات الخارجية الذين يوجد كودهم في التطبيق. إذا قالت صفحة مورّد فُتحت لقاعدة المعرفة هذه إن SDK قد تستخدم البيانات للإعلانات من جهات خارجية، وكان بيان خصوصية التطبيق يعيّن NSPrivacyTracking على false، فهذا التعارض خطر. وحزم SDK غير المعروفة لا تضيف أي صف."
sdk.answer-label-mismatch:
  title: "إفصاح SDK موثّق يتعارض مع إجابة المشروع"
  summary: "يقول Play إن بيانات حزم SDK تُحتسب في قسم أمان البيانات. إذا أجاب المشروع بأن المعرّف الإعلاني لم يُعلن عنه، وكان صف SDK موثّق يذكر معرّف جهاز أو معرّفًا إعلانيًا، فهذا التعارض خطر. والإجابة الفارغة تبقى غير متحقق منها."
apple.restore-purchases:
  title: "عمليات الشراء داخل التطبيق القابلة للاستعادة تحتاج إلى خيار استعادة"
  summary: "يقول الإرشاد 3.1.1 إن عليك التأكد من وجود آلية استعادة لأي عمليات شراء داخل التطبيق قابلة للاستعادة، وتقول صفحة الاشتراكات لدى Apple إن شاشة الاشتراك يجب أن تتضمن طريقة للمشتركين الحاليين لتسجيل الدخول أو استعادة المشتريات. يبحث هذا الفحص عن استدعاء restorePurchases أو تسمية لاستعادة المشتريات في المصدر، أو عن إقرار."
  next: "أضف زر استعادة المشتريات يستدعي دالة الاستعادة في SDK (في RevenueCat: Purchases.restorePurchases())، أو عيّن attestations.payments.restore-control في .launchymind/project.yaml."
apple.subscription-paywall-links:
  title: "الاشتراك يحتاج إلى رابطَي شروط الاستخدام وسياسة الخصوصية"
  summary: "تذكر صفحة Apple الخاصة بالاشتراكات المتجددة تلقائيًا ما يجب أن تتضمنه شاشة الاشتراك: اسم الاشتراك ومدته، وسعر التجديد الكامل، وطريقة لاستعادة المشتريات. وتقول أيضًا إن التطبيق وبيانات App Store الوصفية يجب أن تتضمن روابط إلى شروط الاستخدام وسياسة الخصوصية الخاصة بك. يبحث هذا الفحص عن عبارة شروط الاستخدام أو EULA ورابط خصوصية داخل التطبيق في المصدر، أو عن إقرار."
  next: "ضع رابطَي شروط الاستخدام (أو اتفاقية EULA القياسية من Apple) وسياسة الخصوصية في جدار الدفع، أو عيّن attestations.payments.paywall-links بعد أن تتحقق يدويًا."
google.subscription-offer-terms:
  title: "يجب أن تفصح اشتراكات Play عن السعر ومدة الفوترة والتجديد التلقائي"
  summary: "تقول سياسة الاشتراكات في Google Play إن عليك الإفصاح بوضوح وصراحة عن شروط عرضك، وتكلفة اشتراكك، وتكرار دورة الفوترة، وشروط التجديد التلقائي، وما إذا كان الاشتراك مطلوبًا لاستخدام التطبيق. يبحث هذا الفحص عن عبارات السعر ومدة الفوترة والتجديد التلقائي في المصدر، أو عن إقرار شروط الاشتراك."
  next: "اعرض السعر ومدة الفوترة وأن الاشتراك يتجدد تلقائيًا بجانب زر الاشتراك، أو عيّن attestations.apple.subscription-terms بعد مراجعة جدار الدفع يدويًا."
revenuecat.secret-key-in-app:
  title: "يجب ألا يُشحن مفتاح API سري من RevenueCat داخل التطبيق"
  summary: "تقول RevenueCat إن مفاتيح API السرية تبدأ بالبادئة sk_، وينبغي أن تبقى سرية وألا تُخزَّن إلا على خوادمك، بينما تُستخدم مفاتيح SDK العامة لإعداد SDK. جرى البحث في مصدر التطبيق عن سلسلة نصية حرفية تبدأ بـ sk_. مفاتيح SDK العامة لا مشكلة فيها."
  next: "أزل مفتاح sk_ من التطبيق، وألغِه من لوحة تحكم RevenueCat، وأعدّ SDK باستخدام المفتاح العام الخاص بالتطبيق."
revenuecat.products-configured:
  title: "منتجات RevenueCat وعروضها (offerings) تطابق الكود"
  summary: "عند تعيين REVENUECAT_API_KEY، يقرأ LaunchyMind المنتجات والاستحقاقات (entitlements) والعروض (offerings) من RevenueCat REST API v2 (للقراءة فقط)، ويقارن معرّفات المنتجات في المتجر بمعرّفات المنتجات المكتوبة في الكود. ودون المفتاح لا تُشغَّل هذه القاعدة."
  next: "أضف المنتجات الناقصة في RevenueCat واربطها بـ entitlement وoffering، أو صحّح معرّفات المنتجات في الكود."
google.data-safety-declaration-sdks:
  title: "إعلان أمان البيانات المحلي يغطي ما تجمعه حزم SDK"
  summary: "تقول Google إن قسم أمان البيانات يجب أن يتضمن بيانات المستخدمين التي تنقلها المكتبات وحزم SDK المستخدمة في التطبيق إلى خارج الجهاز. واجهة Play البرمجية لأمان البيانات للكتابة فقط، لذا يقارن LaunchyMind ملف launchymind.datasafety.json في المشروع بأنواع بيانات Play التي تذكرها صفوف SDK الموثّقة. والصفوف التي ليس لها نوع Play واضح تُدرج للربط اليدوي ولا تخفق."
  next: "أضف أنواع البيانات الناقصة إلى launchymind.datasafety.json وإلى قسم أمان البيانات في Play Console، أو تأكد من مورّد SDK أن إعدادك لا يجمعها."
build.native-build:
  title: "البناء الأصلي المطلوب نُفِّذ وقُرئ ملفه المبني"
  summary: "مع scan --build، يبني LaunchyMind ملف APK للتصحيح وتطبيقًا لمحاكي iOS في نسخة مؤقتة من المشروع، ثم يقرأهما كملف مبني جرى فحصه. البناء الذي أخفق خطر. والبناء الذي لم يُنفَّذ بسبب غياب الأدوات يبقى غير متحقق منه، ولا يُعد ناجحًا أبدًا."
  next: "اقرأ أسطر سجل البناء في التقرير، وأصلح البناء، ثم شغّل scan --build مرة أخرى. ثبّت Flutter أو JDK أو Xcode حيث لم يُنفَّذ البناء."
apple.launch-crash:
  title: "بناء iOS يبدأ على المحاكي دون أن يتعطل"
  summary: "يقول الإرشاد 2.1 إن Apple سترفض الملفات الثنائية التي تتعطل أو تُظهر مشكلات تقنية واضحة. مع launchymind run أو scan --live، يُثبَّت ملف IPA على محاكٍ مُشغَّل ويُفتح، ويجب أن يظل التطبيق يعمل بعد بضع ثوانٍ. ودون Xcode أو محاكٍ مُشغَّل يبقى هذا غير متحقق منه."
  next: "افتح تقرير الأعطال في المحاكي أو وحدة تحكم Xcode، وأصلح العطل، ثم شغّل الفحص مرة أخرى."
google.launch-crash:
  title: "بناء Android يبدأ على الجهاز دون أن يتعطل"
  summary: "تقول سياسة الحد الأدنى من الوظائف في Google Play إنها لا تسمح بالتطبيقات التي تتعطل أو تُغلق قسرًا أو تتجمد أو تعمل بشكل غير طبيعي. مع launchymind run أو scan --live، يُثبَّت ملف APK باستخدام adb ويُفتح، ويجب أن تظل العملية تعمل بعد بضع ثوانٍ وألا يذكر سجل الأعطال التطبيق. ودون adb أو جهاز متصل يبقى هذا غير متحقق منه."
  next: "اقرأ سطر العطل في الأدلة أو شغّل adb logcat -b crash، وأصلح العطل، ثم شغّل الفحص مرة أخرى."
legal.accessibility.element-labels:
  title: "ينبغي أن تحمل العناصر التفاعلية تسميات إمكانية الوصول"
  summary: "يقول دليل إمكانية الوصول في Android إن عليك تضمين وصف لغرض كل عنصر في الواجهة، عادةً في contentDescription، وتقول معايير تقييم VoiceOver لدى Apple إن العنصر المهم على الشاشة ينبغي أن تكون له تسمية أو وصف يستطيع VoiceOver نطقه. يبحث هذا الفحص فقط عن واجهات التسمية البرمجية (Semantics وsemanticLabel وaccessibilityLabel وaria-label وcontentDescription) في المصدر. والعثور على واحدة لا يعني أن كل عنصر يحمل تسمية."
  next: "أضف تسميات لأزرار الأيقونات والصور (Semantics أو semanticLabel في Flutter، وaccessibilityLabel في React Native، و.accessibilityLabel في SwiftUI، وcontentDescription في Android)، ثم اختبر باستخدام VoiceOver وTalkBack."
legal.accessibility.nutrition-labels-answered:
  title: "جرى النظر في ملصقات إمكانية الوصول في App Store"
  summary: "تقول Apple إن ملصقات إمكانية الوصول (Accessibility Nutrition Labels) طوعية في البداية، وإنه سيُطلب منك مع الوقت مشاركة تفاصيل دعم إمكانية الوصول لإرسال تطبيقات وتحديثات جديدة. يسأل هذا الفحص فقط عمّا إذا كان المشروع قد أجاب عن attestations.apple.accessibility-labels. وأي إجابة تجتاز الفحص اليوم."
legal.accessibility.eaa-scope-answered:
  title: "أُجيب عمّا إذا كان قانون إمكانية الوصول الأوروبي يشمل التطبيق"
  summary: "تذكر المادة 2(2) الخدمات المقدَّمة للمستهلكين بعد 28 يونيو 2025 التي يشملها التوجيه، ومنها الاتصالات الإلكترونية، والوصول إلى الوسائط السمعية البصرية، وتطبيقات الجوال لنقل الركاب، والخدمات المصرفية للمستهلكين، والكتب الإلكترونية، والتجارة الإلكترونية. وتعفي المادة 4(5) المؤسسات الصغيرة جدًا التي تقدم خدمات. كثير من الألعاب خارج هذه القائمة. يسأل هذا الفحص فقط عمّا إذا كان المشروع قد أجاب عن attestations.eaa.applies. ولا يحدد نطاق التطبيق، وليس استشارة قانونية."
legal.accessibility.eaa-information:
  title: "الخدمة المشمولة تنشر معلومات إمكانية الوصول الخاصة بها"
  summary: "تقول المادة 13 إن مقدمي الخدمات يصممون الخدمات ويقدمونها وفق متطلبات إمكانية الوصول، ويُعدّون المعلومات الواردة في الملحق الخامس، ويشرحون كيف تستوفي الخدمة المتطلبات، ويتيحون هذه المعلومات للعامة بطريقة يسهل الوصول إليها. لا يُشغَّل هذا إلا عندما يقول المشروع إن القانون ينطبق، ويسأل عمّا إذا كانت تلك المعلومات منشورة (attestations.eaa.information). وليس استشارة قانونية."
legal.apple.kids-parental-gate:
  title: "المشتريات والروابط الخارجية في فئة الأطفال خلف بوابة أبوية"
  summary: "يقول الإرشاد 1.3 إن تطبيقات فئة الأطفال يجب ألا تتضمن روابط إلى خارج التطبيق أو فرصًا للشراء أو غير ذلك مما يشتت الأطفال، ما لم تكن مقصورة على منطقة مخصصة خلف بوابة أبوية. في التطبيق عمليات شراء. يسأل هذا الفحص عمّا إذا كان المشروع يصرّح بأن مسار الشراء خلف بوابة أبوية (attestations.apple.kids-parental-gate)."
legal.apple.kids-third-party-analytics:
  title: "لا ينبغي أن تتضمن تطبيقات فئة الأطفال تحليلات من جهات خارجية"
  summary: "يقول الإرشادان 1.3 و5.1.4 إن تطبيقات فئة الأطفال لا ينبغي أن تتضمن تحليلات من جهات خارجية. وفي حالات محدودة قد يُسمح بذلك إذا كانت الخدمة لا تجمع أو تنقل IDFA أو أي معلومات تعريفية عن الأطفال أو مواقعهم أو أجهزتهم. توجد SDK للتحليلات ضمن التبعيات. يخفق الفحص ما لم يصرّح المشروع بأن الاستثناء ينطبق (attestations.apple.kids-analytics-exception)."
legal.coppa.notice-answered:
  title: "سؤال إشعار COPPA له إجابة"
  summary: "تقول المادة 16 CFR 312.3 إن مشغّل الخدمة الموجهة للأطفال يجب عمومًا أن يقدم إشعارًا وأن يحصل على موافقة أبوية قابلة للتحقق قبل جمع معلومات شخصية من طفل. يسجل هذا الفحص فقط ما إذا كان المشروع قد أجاب بأن خطوة الإشعار أُنجزت. ولا يقرر أن التطبيق موجه للأطفال، وليس استشارة قانونية."
legal.dsa.trader-answered:
  title: "أُجيب عن صفة التاجر في الاتحاد الأوروبي"
  summary: "تقول Apple إن المادتين 30 و31 من DSA تلزمانها بجمع معلومات الاتصال الخاصة بالتجار، وإن Apple لا تستطيع تحديد ما إذا كنت تاجرًا. يتطلب هذا الفحص فقط أن يجيب المشروع بنعم أو لا. ولا يحدد صفة التاجر، وليس استشارة قانونية."
legal.gdpr.notice-contents:
  title: "ينبغي أن تتضمن سياسة الخصوصية معلومات المادة 13"
  summary: "تذكر المادة 13 ما يجب على المتحكم تقديمه عند جمع البيانات الشخصية: هوية المتحكم وبيانات الاتصال به، والأغراض والأساس القانوني، والمتلقين، والنقل إلى بلد ثالث، ومدة التخزين، وحقوق صاحب البيانات، والحق في تقديم شكوى إلى سلطة رقابية. يبحث هذا الفحص عن صياغة لكل بند في صفحة الخصوصية المنشورة. إنه مطابقة عبارات وليس مراجعة قانونية، وليس استشارة قانونية."
  next: "أضف بنود المادة 13 الناقصة إلى سياسة الخصوصية: المتحكم وبيانات الاتصال، والأغراض والأساس القانوني، والمتلقون، والنقل إلى بلدان ثالثة، ومدة الاحتفاظ، والحقوق، والحق في تقديم شكوى."
legal.gdpr.lawful-basis-answered:
  title: "سُجّل أساس قانوني لكل غرض من أغراض المعالجة"
  summary: "تقول المادة 6(1) إن المعالجة لا تكون مشروعة إلا إذا انطبق أساس واحد على الأقل من الأسس المذكورة، وتتطلب المادة 13(1)(c) إبلاغ صاحب البيانات بالأساس القانوني. يسأل هذا الفحص فقط عمّا إذا كان المشروع قد سجّل أنه اختار أساسًا لكل غرض (attestations.gdpr.lawful-basis). ولا يختار الأساس، وليس استشارة قانونية."
legal.gdpr.consent-withdrawal:
  title: "عندما تكون الموافقة أساسًا، تشرح السياسة كيفية سحبها"
  summary: "تمنح المادة 7(3) صاحب البيانات الحق في سحب موافقته في أي وقت، وتنص على إبلاغه بذلك قبل الموافقة، وعلى أن يكون السحب بسهولة إعطاء الموافقة. يُشغَّل هذا عندما يقول المشروع إن بعض المعالجة تعتمد على الموافقة، أو عندما يطلب التطبيق نموذج موافقة (UMP). ويبحث عن صياغة تخص السحب في صفحة الخصوصية المنشورة. وليس استشارة قانونية."
legal.gdpr.erasure-path:
  title: "للمستخدمين أصحاب الحسابات طريقة لطلب المحو"
  summary: "تمنح المادة 17 صاحب البيانات الحق في محو بياناته الشخصية دون تأخير غير مبرر عند انطباق أحد أسبابها، وتتطلب المادة 13(2)(b) إبلاغ الناس بوجود هذا الحق. عندما يحتوي التطبيق على حسابات، يبحث هذا الفحص عن مسار حذف داخل التطبيق أو رابط مُعلن لحذف الحساب. ولا يقرر أي سبب ينطبق، وليس استشارة قانونية."
legal.gdpr.processors-answered:
  title: "سُجّلت شروط المعالِجين لحزم SDK الخارجية"
  summary: "تقول المادة 28 إن المتحكم لا يجوز له الاستعانة إلا بمعالِجين يقدمون ضمانات كافية، وإن المعالجة التي يقوم بها المعالِج يحكمها عقد أو صك قانوني آخر. في التطبيق حزم SDK للإعلانات أو التحليلات أو التتبع أو الإشعارات أو المدفوعات. يسأل هذا الفحص عمّا إذا كان المشروع قد سجّل أنه راجع دور كل مورّد وشروطه (attestations.gdpr.processors). بعض موردي SDK يعملون كمتحكمين مستقلين لا كمعالِجين، والقرار في ذلك للمطوّر. وليس استشارة قانونية."
legal.gdpr.transfers-disclosed:
  title: "النقل إلى خارج الاتحاد الأوروبي أو المنطقة الاقتصادية الأوروبية مُفصح عنه"
  summary: "لا تسمح المادة 44 بالنقل إلى بلد ثالث إلا وفق شروط الفصل الخامس، وتتطلب المادة 13(1)(f) إبلاغ صاحب البيانات بأي نقل مزمع وبقرار الملاءمة أو الضمانات. يشحن التطبيق حزم SDK من جهات خارجية. يبحث هذا الفحص عن صياغة تخص النقل في صفحة الخصوصية المنشورة، أو عن تصريح المشروع بعدم حدوث أي نقل (attestations.gdpr.transfers). وليس استشارة قانونية."
legal.google.families-ad-id:
  title: "لا ينبغي أن يحتفظ تطبيق Play الموجه للأطفال بالمعرّف الإعلاني"
  summary: "تقول سياسة العائلات إن التطبيقات التي تستهدف الأطفال حصرًا لا ينبغي أن تطلب إذن AD_ID على Android API 33 أو أعلى، ويجب ألا تنقل المعرّف الإعلاني الخاص بالأطفال. إجابة المشروع لا تثبت أن التطبيق يستهدف الأطفال حصرًا، لذا فهذا خطر وليس رفضًا، وليس استشارة قانونية."
legal.kvkk.consent-answered:
  title: "يجب أن يكون سؤال الموافقة الصريحة في KVKK مُجابًا عنه"
  summary: "المصدر هو بلاغ KVKK بشأن واجب الإفصاح. يسأل هذا الفحص فقط عمّا إذا كان المشروع قد أجاب عن kvkk.explicitConsent. ولا يقرر أن المعالجة تحتاج إلى موافقة، وليس استشارة قانونية."
