cases:
  - id: flutter-detected
    rule: product.flutter-project
    expect: pass
    facts: { framework.flutter: true }
  - id: not-flutter
    rule: product.flutter-project
    expect: fail
    facts: { framework.flutter: false, framework.react_native: false, framework.expo: false, framework.ios: false, framework.android: false, framework.unity: false }
  - id: native-ios-detected
    rule: product.flutter-project
    expect: pass
    facts: { framework.flutter: false, framework.react_native: false, framework.expo: false, framework.ios: true }
  - id: native-android-detected
    rule: product.flutter-project
    expect: pass
    facts: { framework.flutter: false, framework.react_native: false, framework.expo: false, framework.android: true }
  - id: unity-detected
    rule: product.flutter-project
    expect: pass
    facts: { framework.flutter: false, framework.react_native: false, framework.expo: false, framework.unity: true }
  - id: react-native-detected
    rule: product.flutter-project
    expect: pass
    facts: { framework.flutter: false, framework.react_native: true, framework.expo: false }
  - id: expo-detected
    rule: product.flutter-project
    expect: pass
    facts: { framework.flutter: false, framework.react_native: true, framework.expo: true }

  - id: audience-answered
    rule: product.audience-answers
    expect: pass
    facts:
      platform.ios: true
      audience.kids: "no"
      audience.health: "no"
      audience.ugc: "no"
  - id: audience-missing
    rule: product.audience-answers
    expect: unchecked
    facts:
      platform.android: true
      audience.kids: "unknown"
      audience.health: "no"
      audience.ugc: "no"

  - id: kids-without-ads
    rule: apple.kids-third-party
    expect: pass
