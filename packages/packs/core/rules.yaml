      url: https://support.google.com/googleplay/android-developer/answer/13393723
      section: Full description
      publisher: Google Play
    summary:
      en: "Play says the description should accurately describe the app. Naming iPhone, iPad, iOS, or the App Store in the Play listing is a risk, not an automatic rejection."
      tr: "Play, açıklamanın uygulamayı doğru anlatmasını söyler. Play metninde iPhone, iPad, iOS veya App Store geçmesi bir risktir, kendiliğinden ret değildir."
    appliesWhen:
      all:
        - { fact: store.android.other_platform, neq: "not-applicable" }
    evaluate:
      pass:
        all:
          - { fact: store.android.other_platform, eq: "no" }
      fail:
        all:
          - { fact: store.android.other_platform, eq: "yes" }
    check:
      confidence: heuristic
      note: "Play's page does not ban Apple names outright. This is a risk when those names appear in the local Play text."

  - id: store.future-promise
    title: Listing text does not promise a feature that is not here
    severity: risk
    platforms: [any]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-20
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "2.3.7"
      publisher: Apple
    summary:
      en: "Guideline 2.3.7 says subtitles should not make unverifiable product claims. Coming soon and will be added are flagged outside promotional text, which Apple allows to mention upcoming features."
      tr: "Kılavuz 2.3.7, alt başlığın doğrulanamayan ürün iddiaları taşımamasını söyler. Yakında ve eklenecek ifadeleri tanıtım metni dışında işaretlenir; Apple tanıtım metninde yaklaşan özelliklere izin verir."
    appliesWhen:
      all:
        - { fact: store.text.future_promise, neq: "not-applicable" }
    evaluate:
      pass:
        all:
          - { fact: store.text.future_promise, eq: "no" }
      fail:
        all:
          - { fact: store.text.future_promise, eq: "yes" }
    check:
      confidence: heuristic
      note: "Phrases: coming soon, will be added, available soon, yakında, gelecek sürüm. Promotional text is skipped."

  - id: store.copyright-year
    title: Copyright year is not in the future
    severity: risk
    platforms: [any]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-20
      method: primary-source
    source:
      url: https://developer.apple.com/help/app-store-connect/reference/app-information/platform-version-information/
      section: Copyright
      publisher: Apple
    summary:
      en: "Apple says the copyright field starts with the year the rights were obtained. A year after the scan year cannot be that year. An older year is not treated as wrong."
      tr: "Apple, telif alanının hakların alındığı yılla başladığını söyler. Tarama yılından sonraki bir yıl bu olamaz. Daha eski bir yıl yanlış sayılmaz."
    appliesWhen:
      all:
        - { fact: store.copyright.year, neq: "not-applicable" }
    evaluate:
      pass:
        all:
          - { fact: store.copyright.year, eq: "ok" }
      fail:
        all:
          - { fact: store.copyright.year, eq: "future" }
    check:
      confidence: direct
      note: "Apple's example is the year the rights were obtained, such as 2014, so a past year is not a mismatch. Only a year after the scan year fails. No copyright line stays unchecked. This does not decide who owns the rights."

  - id: store.price-claims
    title: Listing text does not add a price the page already shows
    severity: risk
    platforms: [any]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-20
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "2.3.7"
      publisher: Apple
    summary:
      en: "Guideline 2.3.7 says not to pack metadata with pricing information. Play also says title text should not promote a deal such as Free or a percent off."
      tr: "Kılavuz 2.3.7, metaverinin fiyat bilgisiyle doldurulmamasını söyler. Play de başlıkta Free veya yüzde indirim gibi bir kampanya istemez."
    appliesWhen:
      any:
        - { fact: store.ios.present, eq: true }
        - { fact: store.android.present, eq: true }
    evaluate:
      pass:
        all:
          - { fact: store.text.price, eq: "no" }
      fail:
        all:
          - { fact: store.text.price, eq: "yes" }
    check:
      confidence: heuristic
      note: "Prices and percent-off phrases are flagged in listing text. The words free and no ads are flagged only in the name or title. Play's deal guidance is https://support.google.com/googleplay/android-developer/answer/13393723"

  - id: store.keyword-stuffing
    title: Keywords are not repeated or filled with other brands
    severity: risk
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-20
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "2.3.7"
      publisher: Apple
    summary:
      en: "Guideline 2.3.7 says not to pack keywords with trademarked terms, popular app names, or irrelevant phrases. A repeated keyword or a small set of other product names is a risk, not a rejection by itself."
      tr: "Kılavuz 2.3.7, anahtar kelimelerin ticari marka, popüler uygulama adı veya ilgisiz ifadelerle doldurulmamasını söyler. Tekrar veya küçük bir ürün adı listesi başlı başına ret değil, risktir."
    appliesWhen:
      all:
        - { fact: store.keywords.stuffing, neq: "not-applicable" }
    evaluate:
      pass:
        all:
          - { fact: store.keywords.stuffing, eq: "no" }
      fail:
        all:
          - { fact: store.keywords.stuffing, eq: "yes" }
    check:
      confidence: heuristic
      note: "The brand list is facebook, instagram, whatsapp, tiktok, snapchat, spotify, netflix, and youtube. It is not a trademark search."

  - id: store.locale-consistency
    title: English and Turkish listings mention the same features
    severity: risk
    platforms: [any]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-20
      method: primary-source
    source:
      url: https://developer.apple.com/help/app-store-connect/reference/app-information/platform-version-information/
      section: Language
      publisher: Apple
    summary:
      en: "Apple localizes metadata per language. When both an English and a Turkish description exist, a feature word in only one of them is a risk. When only one language is on disk, the other language stays unchecked."
      tr: "Apple metaveriyi dil dil yerelleştirir. Hem İngilizce hem Türkçe açıklama varken bir özellik kelimesi yalnızca birindeyse bu bir risktir. Diskte tek dil varsa diğeri kontrol edilemedi kalır."
    appliesWhen:
      all:
        - { fact: store.locale.features, neq: "not-applicable" }
    evaluate:
      pass:
        all:
          - { fact: store.locale.features, eq: "match" }
      fail:
        all:
          - { fact: store.locale.features, eq: "differ" }
    check:
      confidence: heuristic
      note: "Compares subscription, account, camera, location, ads, offline, and notification with abonelik, hesap, kamera, konum, reklam, çevrimdışı, and bildirim. This is not a translation review."

  - id: store.urls-reachable
    title: URLs written in the store listing open
    severity: risk
    platforms: [any]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-20
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "2.1(a)"
      publisher: Apple
    summary:
      en: "Guideline 2.1(a) says submissions should include fully functional URLs. Listing URLs are fetched only when the scan is online. Offline leaves them unchecked."
      tr: "Kılavuz 2.1(a), gönderimin çalışan URL'ler içermesini söyler. Liste URL'leri yalnızca çevrimiçi taramada istenir. Çevrimdışı durumda kontrol edilemedi kalır."
    appliesWhen:
      all:
        - { fact: store.urls.status, neq: "not-applicable" }
    evaluate:
      pass:
        all:
          - { fact: store.urls.status, eq: "ok" }
      fail:
        all:
          - { fact: store.urls.status, eq: "http-error" }
    check:
      confidence: direct
      note: "At most eight http or https URLs from the listing files are requested. No URL in the files makes the rule not applicable."

  - id: store.ios.icon
    title: App Store icon is 1024 by 1024 and has no alpha
    severity: blocker
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-20
      method: primary-source
    source:
      url: https://developer.apple.com/documentation/xcode/configuring-your-app-icon
      section: "Specify an App Store icon"
      publisher: Apple
    summary:
      en: "Xcode's App Store icon well for iOS is a 1024 by 1024 image. App Store Connect rejects an icon that is transparent or has an alpha channel. A file that cannot be measured stays unchecked."
      tr: "Xcode'daki iOS App Store ikon yuvası 1024'e 1024 görseldir. App Store Connect saydam veya alfa kanallı ikonu reddeder. Ölçülemeyen dosya kontrol edilemedi kalır."
    appliesWhen:
      all:
        - { fact: store.ios.present, eq: true }
    evaluate:
      pass:
        all:
          - { fact: store.ios.icon, eq: "ok" }
      fail:
        all:
          - { fact: store.ios.icon, eq: "bad" }
    check:
      confidence: direct
      note: "Reads .launchymind/store/ios/icon.png or fastlane metadata icon.png. The no-alpha part matches Apple's ITMS-90717 upload error. An unknown image stays unchecked."

  - id: store.ios.screenshots
    title: Screenshots match the required size for the targeted device
    severity: blocker
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-20
      method: primary-source
    source:
      url: https://developer.apple.com/help/app-store-connect/reference/app-information/screenshot-specifications
      section: "iPhone with Dynamic Island (medium display)"
      publisher: Apple
    summary:
      en: "App Store Connect requires an iPhone Dynamic Island screenshot unless the project targets iPad only, in which case a 13-inch iPad size is required. Screenshots cannot include an alpha channel. Up to 10 are allowed per size. A size that is not on the specification list, or a set whose device family was not read, stays unchecked."
      tr: "App Store Connect, proje yalnızca iPad hedeflemiyorsa Dynamic Island'lı iPhone görüntüsü ister; yalnızca iPad ise 13 inç iPad boyutu gerekir. Alfa kanalı olamaz. Boyut başına en fazla 10. Şartname dışı boyut veya okunamayan cihaz ailesi kontrol edilemedi kalır."
    appliesWhen:
      all:
        - { fact: store.ios.present, eq: true }
    evaluate:
      pass:
        all:
          - { fact: store.ios.screenshots, eq: "ok" }
      fail:
        all:
          - { fact: store.ios.screenshots, eq: "bad" }
    check:
      confidence: direct
      note: "iPhone sizes checked on 2026-11-20: 1179x2556, 2556x1179, 1206x2622, 2622x1206. iPad-only, from TARGETED_DEVICE_FAMILY or UIDeviceFamily, uses 2064x2752, 2752x2064, 2048x2732, or 2732x2048. If the family was not read, an iPad-only set stays unchecked instead of failing. Missing files stay unchecked."

  - id: store.play.icon
    title: Play icon is a 512 by 512 PNG
    severity: blocker
    platforms: [android]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-20
      method: primary-source
    source:
      url: https://support.google.com/googleplay/android-developer/answer/9866151
      section: App icon
      publisher: Google Play
    summary:
      en: "Play requires a 512 by 512 32-bit PNG icon with alpha, and the file must be at most 1024 KB. A file that cannot be read stays unchecked."
      tr: "Play, alfa kanallı 512'ye 512 32 bit PNG ikon ister ve dosya en fazla 1024 KB olmalıdır. Okunamayan dosya kontrol edilemedi kalır."
    appliesWhen:
      all:
        - { fact: store.android.present, eq: true }
    evaluate:
      pass:
        all:
          - { fact: store.android.icon, eq: "ok" }
      fail:
        all:
          - { fact: store.android.icon, eq: "bad" }
    check:
      confidence: direct
      note: "Alpha is required for the Play icon, unlike the App Store icon. The 1024 KB cap is the file size on disk. Missing and unreadable icons stay unchecked."

  - id: store.play.feature-graphic
    title: Play feature graphic is 1024 by 500 without alpha
    severity: blocker
    platforms: [android]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-20
      method: primary-source
    source:
      url: https://support.google.com/googleplay/android-developer/answer/9866151
      section: Feature graphic
      publisher: Google Play
    summary:
      en: "Play requires a 1024 by 500 feature graphic as JPEG or 24-bit PNG with no alpha. An unreadable file stays unchecked."
      tr: "Play, alfa kanalı olmayan JPEG veya 24 bit PNG olarak 1024'e 500 özellik grafiği ister. Okunamayan dosya kontrol edilemedi kalır."
    appliesWhen:
      all:
        - { fact: store.android.present, eq: true }
    evaluate:
      pass:
        all:
          - { fact: store.android.feature_graphic, eq: "ok" }
      fail:
        all:
          - { fact: store.android.feature_graphic, eq: "bad" }
    check:
      confidence: direct
      note: "Reads feature-graphic.png or featureGraphic.png. A missing file stays unchecked."

  - id: store.play.screenshots
    title: Play phone screenshots meet the published size and count
    severity: blocker
    platforms: [android]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-20
      method: primary-source
    source:
      url: https://support.google.com/googleplay/android-developer/answer/9866151
      section: Screenshots
      publisher: Google Play
    summary:
      en: "Play asks for at least two and at most eight screenshots. Each side must be from 320 to 3840 pixels, the long side at most twice the short side, with no alpha. A file that cannot be measured stays unchecked."
      tr: "Play en az iki, en çok sekiz ekran görüntüsü ister. Her kenar 320 ile 3840 piksel olmalı, uzun kenar kısa kenarın en fazla iki katı olmalı ve alfa olmamalıdır. Ölçülemeyen dosya kontrol edilemedi kalır."
    appliesWhen:
      all:
        - { fact: store.android.present, eq: true }
    evaluate:
      pass:
        all:
          - { fact: store.android.screenshots, eq: "ok" }
      fail:
        all:
          - { fact: store.android.screenshots, eq: "bad" }
    check:
      confidence: direct
      note: "Phone, Wear, TV, and XR catalogs are not separated. The minimum of two and the 320 to 3840 range are what this check uses."

  - id: artifact.drift
    title: Built artifact matches the values read from source
    severity: risk
    platforms: [any]
    enabled: true
    origin: product
    verification:
      status: verified
      verifiedAt: 2026-11-20
      method: product-rule
    source:
      url: https://github.com/callabens/LaunchyMind
      section: artifact
      publisher: LaunchyMind
    summary:
      en: "When an IPA, APK, or AAB is scanned next to the project, targetSdk, the AD_ID permission, the app privacy-manifest tracking flag, and the camera usage string are compared. A difference is a risk. A value the artifact did not contain stays unchecked."
      tr: "IPA, APK veya AAB proje yanında tarandığında targetSdk, AD_ID izni, privacy manifest izleme bayrağı ve kamera kullanım metni karşılaştırılır. Fark bir risktir. Artifaktta olmayan değer kontrol edilemedi kalır."
    appliesWhen:
      all:
        - { fact: artifact.present, eq: true }
        - { fact: artifact.drift, neq: "not-applicable" }
    evaluate:
      pass:
        all:
          - { fact: artifact.drift, eq: "no" }
      fail:
        all:
          - { fact: artifact.drift, eq: "yes" }
    check:
      confidence: direct
      note: "The provisioning profile signature is not verified. AAB manifests are read from aapt protobuf string fields. An attribute stored only as a resource id stays unread."

