# Flutter's own default minSdk / targetSdk / compileSdk.
# Each row is a tag whose gradle defaults were opened on 2026-11-19.
# A project that only says "Flutter >= X" uses the newest row at or below X.
# That is a minimum, not the SDK that will build the app.
