# Rule explanations (ru). Translated from the English rule texts; keep ids, file names, keys, and guideline numbers unchanged.
product.flutter-project:
  title: "Проект относится к типу, который может прочитать эта проверка"
  summary: "LaunchyMind читает проекты Flutter, React Native, Expo, нативные iOS, нативные Android и Unity. Папка, которая не относится ни к одному из них, не получает вердикта для магазинов. Факт, который не виден по файлам, остаётся непроверенным."
product.audience-answers:
  title: "Вопросы об аудитории, на которые код ответить не может"
  summary: "Дети, здоровье и пользовательский контент нельзя надёжно определить по коду. Пока в .launchymind/project.yaml нет ответов, эти темы остаются непроверенными."
apple.kids-third-party:
  title: "Приложениям для детей следует избегать сторонней рекламы и аналитики"
  summary: "Apple указывает, что приложения, предназначенные в первую очередь для детей, не должны включать стороннюю аналитику или стороннюю рекламу. Ответ об аудитории — это заявление разработчика, а не флажок категории «Для детей»."
apple.privacy-policy-in-app:
  title: "В приложении нужна ссылка на политику конфиденциальности"
  summary: "В исходном коде приложения пока нет ссылки на политику конфиденциальности. Правило 5.1.1(i) требует такую ссылку внутри приложения. Это одна недостающая ссылка, а не вывод о том, что остальное приложение нужно выбросить."
  next: "Добавьте URL политики конфиденциальности на экран, который пользователи могут открыть, например в настройки, и запустите проверку снова."
apple.privacy-policy-metadata:
  title: "URL политики конфиденциальности указан для метаданных магазина"
  summary: "Правило 5.1.1(i) также требует ссылку на политику конфиденциальности в App Store Connect. LaunchyMind не видит App Store Connect. Отсутствие локального указания означает «не проверено», а не провал."
  next: "Если хотите зафиксировать это в проекте, задайте urls.privacy в .launchymind/project.yaml. Оставьте поле пустым, если ссылка есть только в App Store Connect."
apple.privacy-link-opens:
  title: "Ссылка на политику конфиденциальности открывается"
  summary: "Ссылка на политику в приложении и в метаданных должна вести на настоящую политику. Эта проверка запрашивает URL, найденный в проекте, и отмечает ошибки HTTP и страницы-заглушки."
apple.privacy-policy-content:
  title: "Текст политики охватывает сбор, удаление и согласие"
  summary: "Правило 5.1.1(i) требует, чтобы политика указывала, какие данные собираются и как, все способы их использования, защиту третьими сторонами, хранение и удаление, а также как пользователь может отозвать согласие или запросить удаление. Совпадения ключевых слов — это эвристика, а не проверка политики."
apple.support-contact:
  title: "Есть URL поддержки или способ связи"
  summary: "Правило 1.5 требует, чтобы у пользователей был способ связаться с вами. Если в проекте нет URL поддержки, LaunchyMind не видит соответствующее поле App Store Connect, поэтому результат остаётся непроверенным. Указанная страница, которая не открывается, — отдельная проверка."
  next: "Добавьте URL поддержки в приложение или в project.yaml либо сами проверьте поле URL поддержки в App Store Connect."
apple.support-link-quality:
  title: "На странице поддержки указан способ связи"
  summary: "Страница поддержки должна давать простой способ связаться. Эта проверка ищет адрес электронной почты или фразу о связи и отклоняет страницы-заглушки."
apple.account-deletion:
  title: "Если можно создать аккаунт, его нужно удалять в приложении"
  summary: "Если приложение позволяет создать аккаунт, оно также должно позволять удалить аккаунт в самом приложении. Эта проверка ищет символы удаления или ссылку на удаление в приложении. Она не может оценить, легко ли найти этот элемент."
apple.tracking-permission:
  title: "Для отслеживания нужно уведомление App Tracking Transparency"
  summary: "Чтобы отслеживать пользователей, нужно получить явное разрешение через API App Tracking Transparency. Если есть SDK рекламы или отслеживания, эта проверка требует NSUserTrackingUsageDescription."
apple.login-equivalent:
  title: "Для входа через сторонний сервис нужен равноценный вариант"
  summary: "Приложения, которые используют вход через сторонний сервис или соцсеть для основного аккаунта, должны также предлагать равноценный вход, который ограничивает данные именем и адресом электронной почты, позволяет скрыть адрес и не собирает действия в приложении для рекламы без согласия. Apple перечисляет исключения, которые эта проверка не видит."
apple.permission-camera:
  title: "Для использования камеры нужна строка назначения iOS"
  summary: "Строки назначения должны ясно и полностью описывать, как используются данные. Если обнаружена работа с камерой, а NSCameraUsageDescription нет, проверка не пройдена."
apple.permission-photos:
  title: "Для использования медиатеки нужна строка назначения iOS"
  summary: "Для доступа к медиатеке нужна строка назначения, описывающая использование. NSPhotoLibraryUsageDescription или NSPhotoLibraryAddUsageDescription достаточно для проверки наличия."
apple.permission-location:
  title: "Для использования геопозиции нужна строка назначения iOS"
  summary: "Для доступа к геопозиции нужна строка назначения. Ключей «при использовании» или «всегда» достаточно для проверки наличия."
apple.permission-microphone:
  title: "Для использования микрофона нужна строка назначения iOS"
  summary: "Для доступа к микрофону нужна NSMicrophoneUsageDescription с описанием использования."
apple.permission-contacts:
  title: "Для использования контактов нужна строка назначения iOS"
  summary: "Для доступа к контактам нужна NSContactsUsageDescription с описанием использования."
apple.privacy-manifest-reasons:
  title: "API с обязательной причиной в манифесте конфиденциальности требуют кодов причин"
  summary: "С 1 мая 2024 года App Store Connect не принимает приложения, которые используют API с обязательной причиной и не описывают эту причину в манифесте конфиденциальности. Проверка не пройдена, только если манифест проекта перечисляет API без кода причины."
apple.listed-sdk-manifest:
  title: "Перечисленным сторонним SDK нужны их манифесты конфиденциальности"
  summary: "Apple требует манифест конфиденциальности для перечисленных SDK, входящих в отправляемую сборку. Плагины из версионированной таблицы LaunchyMind поставляются со своим PrivacyInfo.xcprivacy, поэтому они не остаются непроверенными. Перечисленному SDK, которого нет в этой таблице, по-прежнему нужно подтверждение."
  next: "Для перечисленного SDK, которого нет в таблице встроенных манифестов, проверьте pod или пакет и задавайте apple.listed-sdk-manifests, только когда увидите файл."
apple.minimum-os:
  title: "Загружаемые сборки должны быть рассчитаны на iOS 13 или новее"
  summary: "С 9 сентября 2026 года приложения для iOS и iPadOS, загружаемые в App Store Connect, должны быть рассчитаны на iOS 13 или новее."
apple.xcode-sdk:
  title: "Загружаемые сборки должны быть собраны в Xcode 26 с iOS 26 SDK"
  summary: "С 28 апреля 2026 года приложения, загружаемые в App Store Connect, должны быть собраны в Xcode 26 или новее с SDK iOS 26, iPadOS 26, tvOS 26, visionOS 26 или watchOS 26. В исходном коде проекта нет версии Xcode, поэтому эта проверка использует явное подтверждение."
apple.age-rating:
  title: "Нужно ответить на обновлённые вопросы о возрастном рейтинге"
  summary: "На вопросы Apple о возрастном рейтинге нужно было ответить до 31 января 2026 года, чтобы избежать перебоев при отправке обновлений. App Store Connect не запрашивался, поэтому эта проверка использует явное подтверждение."
apple.subscription-terms:
  title: "Экран покупки подписки должен описывать предложение"
  summary: "Прежде чем просить пользователя оформить подписку, приложение должно ясно описать, что он получит за эту цену. Эта проверка ищет слова о подписке и цене или подтверждение. Она не читает Приложение 2 к соглашению разработчика."
google.target-api:
  title: "Новые приложения и обновления должны быть ориентированы на Android 16 (API 36)"
  summary: "С 31 августа 2026 года новые приложения и обновления должны быть ориентированы на Android 16 (уровень API 36) или выше; есть исключения для отдельных типов устройств, которые этот сканер не определяет. Срок продления на странице справки действовал до 1 ноября 2026 года."
google.privacy-policy:
  title: "Play требует ссылку на политику конфиденциальности"
  summary: "Google Play указывает, что каждый разработчик должен заполнить раздел «Безопасность данных», в том числе для приложений, которые не собирают пользовательские данные, и указать ссылку на политику конфиденциальности. Play Console не запрашивалась."
google.data-safety-form:
  title: "Нужно заполнить раздел «Безопасность данных»"
  summary: "Все разработчики, у которых есть приложение в Google Play, должны заполнить раздел «Безопасность данных», и сбор данных через SDK тоже учитывается. Приложения только на канале внутреннего тестирования освобождены от этого. Play Console не запрашивалась, поэтому используется подтверждение."
google.account-deletion:
  title: "Если можно создать аккаунт, нужны путь удаления в приложении и веб-ссылка"
  summary: "Если приложение позволяет создать аккаунт, Google Play требует путь для удаления аккаунта в приложении и веб-ссылку, по которой пользователи могут запросить удаление. Ссылка в приложении на этот веб-ресурс может служить путём в приложении."
google.account-deletion-link:
  title: "Веб-ссылка на удаление аккаунта должна открываться и называть приложение"
  summary: "Google указывает, что веб-ссылка должна загружаться, путь удаления должен быть легко найти, а на странице должно быть название приложения или разработчика в том виде, в каком оно указано на странице приложения в магазине."
google.closed-testing:
  title: "Новым личным аккаунтам Play нужно закрытое тестирование"
  summary: "Личные аккаунты Play Console, созданные после 13 ноября 2023 года, должны провести закрытое тестирование, в котором не менее 12 тестировщиков непрерывно участвуют 14 дней, прежде чем получить доступ к рабочей версии. Аккаунты организаций под это требование не подпадают. Тип аккаунта берётся из подтверждения."
iab.app-ads:
  title: "Приложения с рекламой публикуют файл app-ads.txt"
  summary: "app-ads.txt 1.0 от IAB Tech Lab — это стандарт ads.txt для приложений. В ads.txt 1.1 добавлены OWNERDOMAIN и MANAGERDOMAIN. Эта проверка запрашивает app-ads.txt в корне указанного сайта разработчика. Она не придумывает идентификаторы продавцов."
policy.ads-disclosure:
  title: "На странице конфиденциальности приложения с рекламой следует упомянуть рекламу"
  summary: "Политика конфиденциальности должна описывать, как используются собранные данные, включая передачу рекламным сетям, если она происходит. Если есть рекламный SDK, а полученная политика ни разу не упоминает рекламу, это риск, а не блокер."
kvkk.disclosure:
  title: "Темы уведомления по статье 10 KVKK на странице конфиденциальности"
  summary: "При получении персональных данных оператор должен сообщить человеку как минимум свои данные, цель, кто получает данные и зачем, способ сбора и правовое основание, а также права по статье 11. В руководстве мобильные приложения названы одним из электронных способов это сделать. Совпадения ключевых слов не являются юридическим заключением."
kvkk.consent-separate:
  title: "Явное согласие и текст уведомления — отдельные шаги"
  summary: "Если обработка основана на явном согласии, обязанность уведомления и получение явного согласия выполняются раздельно. Эта проверка не решает, нужно ли приложению явное согласие. Она использует ответ проекта."
  next: "В .launchymind/project.yaml задайте kvkk.explicitConsent, а если значение true — ещё и kvkk.consentSeparate. См. пример в README."
apple.privacy-manifest-tracking:
  title: "Реклама или отслеживание должны соответствовать полям отслеживания в манифесте конфиденциальности"
  summary: "Приложение, которое показывает рекламу или запрашивает отслеживание, должно иметь манифест конфиденциальности уровня приложения, в котором флаг NSPrivacyTracking согласуется с собираемыми типами данных, помеченными как используемые для отслеживания, и с доменами отслеживания, когда отслеживание включено. Несоответствие — это риск, а не доказанный отказ."
  next: "Откройте PrivacyInfo.xcprivacy приложения. Если вы отслеживаете пользователей, установите NSPrivacyTracking в true и перечислите домены отслеживания. Если собираемый тип данных помечен для отслеживания, флаг отслеживания не должен быть false."
apple.stub-purchase-ui:
  title: "Текст-заглушка покупки или восстановления покупок без SDK покупок"
  summary: "Правило 2.1(a) требует, чтобы отправляемые сборки были окончательными, а текст-заглушка был удалён. Текст о восстановлении покупок или заглушка покупки без SDK покупок — это риск, если этот текст доступен пользователю. Флаг const false, который его скрывает, — лишь наблюдение."
  next: "Удалите текст-заглушку или держите его за флагом const false, пока не подключите настоящий SDK покупок."
google.sample-ad-id:
  title: "Тестовые идентификаторы рекламных блоков Google не должны попадать в релиз"
  summary: "Google публикует тестовые рекламные блоки с идентификатором издателя ca-app-pub-3940256099942544. Этот идентификатор в Info.plist, манифесте Android или коде Dart, который явно не ограничен отладочной веткой, — это риск."
  next: "Держите тестовый идентификатор за kDebugMode или kReleaseMode, а в plist и манифест релиза добавьте собственные идентификаторы рекламных блоков."
google.ump-consent-call:
  title: "Приложениям с рекламой следует запрашивать обновление согласия UMP"
  summary: "В руководстве AdMob по согласию в ЕС Google рекомендует запрашивать обновление информации о согласии через платформу сообщений для пользователей при запуске, так как в некоторых регионах согласие обязательно. Рекламный SDK без вызова requestConsentInfoUpdate, ConsentInformation или UserMessagingPlatform в lib/ — это риск."
  next: "Вызывайте ConsentInformation.instance.requestConsentInfoUpdate перед загрузкой рекламы и оставьте точку входа в настройки конфиденциальности там, где этого требует Google."
product.kids-policy-consistency:
  title: "Политика «не для детей» должна совпадать с ответом о детях"
  summary: "Если полученная страница конфиденциальности говорит, что приложение не предназначено для детей, audience.kids не должен быть yes. Отсутствующий ответ остаётся непроверенным, чтобы страницу и файл проекта можно было согласовать."
  next: "Если страница верна, задайте audience.kids: false в .launchymind/project.yaml. Если приложение для детей, измените страницу и ответьте на вопросы магазина о возрастном рейтинге."
google.ad-id-permission:
  title: "Для рекламы на Android нужно разрешение на рекламный идентификатор"
  summary: "Android 13 требует разрешение AD_ID для приложений, использующих рекламный идентификатор. Разрешение, объявленное в манифесте библиотеки SDK, объединяется с манифестом приложения. google_mobile_ads зависит от play-services-ads, поэтому эта зависимость учитывается, если манифест приложения не удаляет разрешение."
  next: "Объявите com.google.android.gms.permission.AD_ID или оставьте google_mobile_ads, не удаляя разрешение. Объединённый манифест в android/app/build тоже читается, если он есть."
google.data-safety-ad-id:
  title: "При использовании рекламы раздел «Безопасность данных» должен включать рекламный идентификатор"
  summary: "В разделе «Безопасность данных» Play указано, что рекламный идентификатор Android нужно указывать как «Идентификаторы устройства или другие идентификаторы». Play Console не запрашивалась, поэтому используется ответ проекта google.data-safety-ad-id."
  next: "Задайте attestations.google.data-safety-ad-id: true в .launchymind/project.yaml после того, как раздел «Безопасность данных» будет включать рекламный идентификатор."
store.ios.name-length:
  title: "Название в App Store — от 2 до 30 символов"
  summary: "App Store Connect требует, чтобы локализованное название приложения было не короче 2 и не длиннее 30 символов. Читается только локальный name.txt."
store.ios.subtitle-length:
  title: "Подзаголовок в App Store — не более 30 символов"
  summary: "Подзаголовок под названием приложения не может быть длиннее 30 символов. Проект без файла подзаголовка не считается проваленным."
store.ios.description-length:
  title: "Описание в App Store — не более 4000 символов"
  summary: "Описание в App Store ограничено 4000 символами и должно быть обычным текстом. Подсчитывается локальный файл описания."
store.ios.keywords-length:
  title: "Ключевые слова App Store укладываются в 100 байт"
  summary: "Ключевые слова могут занимать до 100 байт. Справка App Store Connect считает байты, и эта проверка тоже."
store.ios.promo-length:
  title: "Рекламный текст — не более 170 символов"
  summary: "Рекламный текст не может быть длиннее 170 символов. Он необязателен, поэтому отсутствие файла не считается провалом."
store.ios.release-notes-length:
  title: "Текст «Что нового» — не более 4000 символов"
  summary: "Раздел «Что нового в этой версии» ограничен 4000 символами. Без локального файла заметок о выпуске эта проверка не выполняется."
store.play.title-length:
  title: "Название в Play — не более 30 символов"
  summary: "Play Console ограничивает название приложения 30 символами, считая полноширинные и полуширинные символы за один каждый."
store.play.short-description-length:
  title: "Краткое описание в Play — не более 80 символов"
  summary: "Краткое описание в Play ограничено 80 символами. Измеряется локальный файл краткого описания."
store.play.full-description-length:
  title: "Полное описание в Play — не более 4000 символов"
  summary: "Полное описание в Play допускает 4000 символов. Подсчитывается локальный файл полного описания."
store.placeholder-text:
  title: "Текст страницы в магазине не является заглушкой"
  summary: "Правило 2.1(a) требует удалить текст-заглушку и другой временный контент перед отправкой. Lorem ipsum, TODO и TBD в локальном тексте страницы — это провал."
store.ios.other-platform:
  title: "Страница iOS не называет другую мобильную платформу"
  summary: "Правило 2.3.10 запрещает включать в приложение или его метаданные названия других мобильных платформ или альтернативных магазинов."
store.play.other-platform:
  title: "Страница Play не делает акцент на другой мобильной платформе"
  summary: "Play требует, чтобы описание точно описывало приложение. Упоминание iPhone, iPad, iOS или App Store на странице Play — это риск, а не автоматический отказ."
store.future-promise:
  title: "Текст страницы не обещает функцию, которой нет"
  summary: "Правило 2.3.7 указывает, что подзаголовки не должны содержать непроверяемых заявлений о продукте. Фразы вроде «скоро» и «будет добавлено» отмечаются вне рекламного текста, в котором Apple разрешает упоминать будущие функции."
store.copyright-year:
  title: "Год авторских прав не в будущем"
  summary: "Apple указывает, что поле авторских прав начинается с года получения прав. Год позже года проверки не может быть таким годом. Более ранний год не считается ошибкой."
store.price-claims:
  title: "Текст страницы не добавляет цену, которую страница уже показывает"
  summary: "Правило 2.3.7 запрещает перегружать метаданные информацией о ценах. Play также указывает, что название не должно продвигать предложения вроде «Бесплатно» или скидки в процентах."
store.keyword-stuffing:
  title: "Ключевые слова не повторяются и не забиты чужими брендами"
  summary: "Правило 2.3.7 запрещает забивать ключевые слова товарными знаками, названиями популярных приложений или нерелевантными фразами. Повторяющееся ключевое слово или несколько названий чужих продуктов — это риск, а не отказ сам по себе."
store.locale-consistency:
  title: "Английская и турецкая страницы упоминают одни и те же функции"
  summary: "Apple локализует метаданные для каждого языка. Если есть и английское, и турецкое описание, слово о функции, которое есть только в одном из них, — это риск. Если на диске только один язык, другой остаётся непроверенным."
store.urls-reachable:
  title: "URL, указанные на странице в магазине, открываются"
  summary: "Правило 2.1(a) требует, чтобы отправляемые сборки содержали полностью рабочие URL. URL со страницы запрашиваются только при онлайн-проверке. В офлайн-режиме они остаются непроверенными."
store.ios.icon:
  title: "Значок App Store — 1024×1024 без альфа-канала"
  summary: "Ячейка значка App Store в Xcode для iOS — это изображение 1024×1024. App Store Connect отклоняет прозрачный значок или значок с альфа-каналом. Файл, который нельзя измерить, остаётся непроверенным."
store.ios.screenshots:
  title: "Снимки экрана соответствуют требуемому размеру для целевого устройства"
  summary: "App Store Connect требует снимок экрана iPhone с Dynamic Island, если проект не предназначен только для iPad; в этом случае нужен размер 13-дюймового iPad. Снимки экрана не могут содержать альфа-канал. Для каждого размера допускается до 10 снимков. Размер, которого нет в списке спецификаций, или набор, семейство устройств которого не удалось прочитать, остаётся непроверенным."
store.play.icon:
  title: "Значок Play — PNG 512×512"
  summary: "Play требует значок PNG 512×512, 32 бита, с альфа-каналом, а размер файла должен быть не более 1024 КБ. Файл, который нельзя прочитать, остаётся непроверенным."
store.play.feature-graphic:
  title: "Картинка для описания в Play — 1024×500 без альфа-канала"
  summary: "Play требует картинку для описания размером 1024×500 в формате JPEG или 24-битного PNG без альфа-канала. Нечитаемый файл остаётся непроверенным."
store.play.screenshots:
  title: "Скриншоты для телефона в Play соответствуют опубликованным размерам и количеству"
  summary: "Play требует не менее двух и не более восьми скриншотов. Каждая сторона должна быть от 320 до 3840 пикселей, длинная сторона — не более чем вдвое длиннее короткой, без альфа-канала. Файл, который нельзя измерить, остаётся непроверенным."
artifact.drift:
  title: "Собранный артефакт совпадает со значениями из исходного кода"
  summary: "Когда IPA, APK или AAB проверяется рядом с проектом, сравниваются targetSdk, разрешение AD_ID, флаг отслеживания в манифесте конфиденциальности приложения и строка использования камеры. Расхождение — это риск. Значение, которого нет в артефакте, остаётся непроверенным."
sdk.manifest-label-mismatch:
  title: "Проверенное раскрытие SDK расходится с манифестом конфиденциальности"
  summary: "Apple указывает, что ответы о конфиденциальности должны учитывать сторонних партнёров, чей код есть в приложении. Если страница поставщика, открытая для этой базы знаний, говорит, что SDK может использовать данные для сторонней рекламы, а манифест конфиденциальности приложения задаёт NSPrivacyTracking в false, это расхождение — риск. Неизвестные SDK строк не добавляют."
sdk.answer-label-mismatch:
  title: "Проверенное раскрытие SDK расходится с ответом проекта"
  summary: "Play указывает, что данные SDK учитываются в разделе «Безопасность данных». Если проект отвечает, что рекламный идентификатор не указан, а проверенная строка SDK содержит идентификатор устройства или рекламный идентификатор, это расхождение — риск. Пустой ответ остаётся непроверенным."
apple.restore-purchases:
  title: "Для восстанавливаемых встроенных покупок нужен элемент восстановления"
  summary: "Правило 3.1.1 требует наличия механизма восстановления для всех восстанавливаемых встроенных покупок, а страница Apple о подписках указывает, что на экране оформления должен быть способ для текущих подписчиков войти или восстановить покупки. Эта проверка ищет вызов restorePurchases или надпись о восстановлении покупок в исходном коде либо подтверждение."
  next: "Добавьте кнопку «Восстановить покупки», вызывающую метод восстановления SDK (RevenueCat: Purchases.restorePurchases()), или задайте attestations.payments.restore-control в .launchymind/project.yaml."
apple.subscription-paywall-links:
  title: "Для оформления подписки нужны ссылки на Условия использования и Политику конфиденциальности"
  summary: "Страница Apple об автовозобновляемых подписках перечисляет, что должно быть на экране оформления: название и срок подписки, полная цена продления и способ восстановить покупки. Там же сказано, что приложение и метаданные App Store должны содержать ссылки на ваши Условия использования и Политику конфиденциальности. Эта проверка ищет в исходном коде упоминание Условий использования или EULA и URL политики конфиденциальности в приложении либо подтверждение."
  next: "Разместите на пейволле ссылки на Условия использования (или стандартное EULA Apple) и Политику конфиденциальности либо задайте attestations.payments.paywall-links после ручной проверки."
google.subscription-offer-terms:
  title: "Подписки в Play должны раскрывать цену, период оплаты и автопродление"
  summary: "Правила Google Play в отношении подписок требуют ясно и явно раскрывать условия предложения, стоимость подписки, периодичность списаний, условия автоматического продления и то, нужна ли подписка для использования приложения. Эта проверка ищет в исходном коде упоминания цены, периода оплаты и автопродления либо подтверждение условий подписки."
  next: "Покажите рядом с кнопкой подписки цену, период оплаты и то, что подписка продлевается автоматически, или задайте attestations.apple.subscription-terms после ручной проверки пейволла."
revenuecat.secret-key-in-app:
  title: "Секретный ключ API RevenueCat не должен попадать в приложение"
  summary: "RevenueCat указывает, что секретные ключи API начинаются с sk_, должны храниться в тайне и только на ваших собственных серверах, а SDK настраивается публичными ключами SDK. В исходном коде приложения искался строковый литерал, начинающийся с sk_. Публичные ключи SDK допустимы."
  next: "Удалите ключ sk_ из приложения, отзовите его в панели RevenueCat и настройте SDK с публичным ключом для конкретного приложения."
revenuecat.products-configured:
  title: "Продукты и offerings RevenueCat совпадают с кодом"
  summary: "Если задан REVENUECAT_API_KEY, LaunchyMind читает продукты, entitlements и offerings через RevenueCat REST API v2 (только чтение) и сравнивает идентификаторы продуктов в магазине с ID продуктов, указанными в коде. Без ключа это правило не выполняется."
  next: "Добавьте недостающие продукты в RevenueCat, привяжите их к entitlement и offering или исправьте ID продуктов в коде."
google.data-safety-declaration-sdks:
  title: "Локальная декларация «Безопасность данных» охватывает то, что собирают SDK"
  summary: "Google указывает, что раздел «Безопасность данных» должен включать пользовательские данные, которые библиотеки и SDK приложения передают за пределы устройства. API Play для безопасности данных доступен только для записи, поэтому LaunchyMind сравнивает launchymind.datasafety.json проекта с типами данных Play, которые называют проверенные строки SDK. Строки без однозначного типа Play перечисляются для ручного сопоставления и не приводят к провалу."
  next: "Добавьте недостающие типы данных в launchymind.datasafety.json и в раздел «Безопасность данных» в Play Console или уточните у поставщика SDK, что ваша конфигурация их не собирает."
build.native-build:
  title: "Запрошенная нативная сборка выполнена, и её артефакт прочитан"
  summary: "С scan --build LaunchyMind собирает отладочный APK и приложение для симулятора iOS во временной копии проекта, а затем читает их как проверяемый артефакт. Неудачная сборка — это риск. Сборка, которая не выполнялась из-за отсутствия инструментов, остаётся непроверенной и никогда не считается пройденной."
  next: "Прочитайте строки журнала сборки в отчёте, исправьте сборку и снова запустите scan --build. Установите Flutter, JDK или Xcode там, где сборка не выполнялась."
apple.launch-crash:
  title: "Сборка iOS запускается на симуляторе без сбоев"
  summary: "Правило 2.1 указывает, что Apple отклоняет бинарные файлы, которые аварийно завершаются или имеют явные технические проблемы. С launchymind run или scan --live IPA устанавливается на запущенный симулятор и открывается; через несколько секунд приложение должно по-прежнему работать. Без Xcode или запущенного симулятора результат остаётся непроверенным."
  next: "Откройте отчёт о сбое симулятора или консоль Xcode, исправьте сбой и запустите проверку снова."
google.launch-crash:
  title: "Сборка Android запускается на устройстве без сбоев"
  summary: "Правила Google Play о минимальной функциональности не допускают приложений, которые аварийно завершаются, принудительно закрываются, зависают или иным образом работают некорректно. С launchymind run или scan --live APK устанавливается через adb и запускается; через несколько секунд процесс должен по-прежнему работать, а в журнале сбоев не должно быть приложения. Без adb или подключённого устройства результат остаётся непроверенным."
  next: "Прочитайте строку о сбое в доказательствах или выполните adb logcat -b crash, исправьте сбой и запустите проверку снова."
legal.accessibility.element-labels:
  title: "У интерактивных элементов должны быть метки специальных возможностей"
  summary: "Руководство Android по специальным возможностям требует описывать назначение каждого элемента интерфейса, обычно в contentDescription, а критерии оценки VoiceOver от Apple указывают, что у важного элемента на экране должна быть метка или описание, которое VoiceOver может озвучить. Эта проверка ищет в исходном коде только API меток (Semantics, semanticLabel, accessibilityLabel, aria-label, contentDescription). Найденный вызов не означает, что метки есть у всех элементов."
  next: "Добавьте метки кнопкам-значкам и изображениям (Flutter Semantics или semanticLabel, React Native accessibilityLabel, SwiftUI .accessibilityLabel, Android contentDescription), затем проверьте с VoiceOver и TalkBack."
legal.accessibility.nutrition-labels-answered:
  title: "Метки специальных возможностей App Store рассмотрены"
  summary: "Apple указывает, что метки специальных возможностей (Accessibility Nutrition Labels) поначалу добровольны, но со временем для отправки новых приложений и обновлений потребуется сообщать сведения о поддержке специальных возможностей. Эта проверка только спрашивает, ответил ли проект на attestations.apple.accessibility-labels. Сейчас подходит любой ответ."
legal.accessibility.eaa-scope-answered:
  title: "Дан ответ, распространяется ли на приложение Европейский акт о доступности"
  summary: "Статья 2(2) перечисляет услуги, оказываемые потребителям после 28 июня 2025 года, на которые распространяется Директива, в том числе электронные коммуникации, доступ к аудиовизуальным медиа, мобильные приложения для пассажирских перевозок, банковские услуги для потребителей, электронные книги и электронную торговлю. Статья 4(5) освобождает микропредприятия, оказывающие услуги. Многие игры не входят в этот перечень. Эта проверка только спрашивает, ответил ли проект на attestations.eaa.applies. Она не определяет сферу применения и не является юридической консультацией."
legal.accessibility.eaa-information:
  title: "Услуга, на которую распространяется акт, публикует информацию о доступности"
  summary: "Статья 13 указывает, что поставщики услуг проектируют и оказывают услуги в соответствии с требованиями доступности, готовят информацию по Приложению V, объясняют, как услуга соответствует требованиям, и публикуют эту информацию в доступной форме. Проверка выполняется, только если проект указал, что акт применяется, и спрашивает, опубликована ли эта информация (attestations.eaa.information). Это не юридическая консультация."
legal.apple.kids-parental-gate:
  title: "Покупки и внешние ссылки в категории «Для детей» закрыты родительским контролем"
  summary: "Правило 1.3 указывает, что приложения категории «Для детей» не должны содержать ссылок за пределы приложения, возможностей покупки или других отвлекающих детей элементов, если они не вынесены в отдельную зону за родительским контролем. В приложении есть покупки. Эта проверка спрашивает, заявляет ли проект, что процесс покупки закрыт родительским контролем (attestations.apple.kids-parental-gate)."
legal.apple.kids-third-party-analytics:
  title: "Приложения категории «Для детей» не должны включать стороннюю аналитику"
  summary: "Правила 1.3 и 5.1.4 указывают, что приложения категории «Для детей» не должны включать стороннюю аналитику. В отдельных случаях это допустимо, если сервис не собирает и не передаёт IDFA или любую идентифицирующую информацию о детях, их местоположении или устройствах. В зависимостях есть SDK аналитики. Проверка не пройдена, если проект не заявляет, что действует исключение (attestations.apple.kids-analytics-exception)."
legal.coppa.notice-answered:
  title: "На вопрос об уведомлении COPPA дан ответ"
  summary: "16 CFR 312.3 указывает, что оператор сервиса для детей, как правило, должен предоставить уведомление и получить проверяемое согласие родителей до сбора персональной информации ребёнка. Эта проверка лишь фиксирует, ответил ли проект, что шаг уведомления выполнен. Она не решает, что приложение предназначено для детей, и не является юридической консультацией."
legal.dsa.trader-answered:
  title: "Дан ответ о статусе продавца-коммерсанта в ЕС"
  summary: "Apple указывает, что статьи 30 и 31 DSA обязывают её собирать контактные данные коммерсантов и что Apple не может определить, являетесь ли вы коммерсантом. Эта проверка требует лишь, чтобы проект ответил «да» или «нет». Она не определяет статус коммерсанта и не является юридической консультацией."
legal.gdpr.notice-contents:
  title: "Политика конфиденциальности должна содержать информацию по статье 13"
  summary: "Статья 13 перечисляет, что контролёр должен предоставить при сборе персональных данных: свои данные и контакты, цели и правовое основание, получателей, передачу в третью страну, срок хранения, права субъекта данных и право подать жалобу в надзорный орган. Эта проверка ищет формулировки по каждому пункту на опубликованной странице конфиденциальности. Это сопоставление фраз, а не юридическая проверка, и не юридическая консультация."
  next: "Добавьте в политику конфиденциальности недостающие пункты статьи 13: контролёр и контакты, цели и правовое основание, получатели, передача в третьи страны, срок хранения, права и право подать жалобу."
legal.gdpr.lawful-basis-answered:
  title: "Для каждой цели обработки зафиксировано правовое основание"
  summary: "Статья 6(1) указывает, что обработка законна, только если применимо хотя бы одно из перечисленных оснований, а статья 13(1)(c) требует сообщить субъекту данных правовое основание. Эта проверка только спрашивает, зафиксировал ли проект, что выбрал основание для каждой цели (attestations.gdpr.lawful-basis). Она не выбирает основание и не является юридической консультацией."
legal.gdpr.consent-withdrawal:
  title: "Если основанием служит согласие, политика объясняет, как его отозвать"
  summary: "Статья 7(3) даёт субъекту данных право отозвать согласие в любой момент, требует сообщить ему об этом до дачи согласия и делает отзыв таким же простым, как дача согласия. Проверка выполняется, когда проект указывает, что часть обработки основана на согласии, или когда приложение запрашивает форму согласия (UMP). Она ищет формулировки об отзыве на опубликованной странице конфиденциальности. Это не юридическая консультация."
legal.gdpr.erasure-path:
  title: "У пользователей с аккаунтом есть способ запросить удаление данных"
  summary: "Статья 17 даёт субъекту данных право добиться удаления персональных данных без неоправданной задержки при наличии одного из её оснований, а статья 13(2)(b) требует сообщать людям о существовании этого права. Если в приложении есть аккаунты, эта проверка ищет путь удаления в приложении или указанный URL удаления аккаунта. Она не решает, какое основание применимо, и не является юридической консультацией."
legal.gdpr.processors-answered:
  title: "Условия обработчиков для сторонних SDK зафиксированы"
  summary: "Статья 28 указывает, что контролёр может привлекать только обработчиков, предоставляющих достаточные гарантии, а обработка обработчиком регулируется договором или иным правовым актом. В приложении есть SDK рекламы, аналитики, отслеживания, уведомлений или платежей. Эта проверка спрашивает, зафиксировал ли проект, что изучил роль и условия каждого поставщика (attestations.gdpr.processors). Некоторые поставщики SDK действуют как самостоятельные контролёры, а не обработчики; решать это разработчику. Это не юридическая консультация."
legal.gdpr.transfers-disclosed:
  title: "Передача данных за пределы ЕС или ЕЭЗ раскрыта"
  summary: "Статья 44 допускает передачу в третью страну только на условиях главы V, а статья 13(1)(f) требует сообщить субъекту данных о планируемой передаче и о решении о достаточности защиты или гарантиях. Приложение включает сторонние SDK. Эта проверка ищет формулировки о передаче на опубликованной странице конфиденциальности или заявление проекта о том, что передачи нет (attestations.gdpr.transfers). Это не юридическая консультация."
legal.google.families-ad-id:
  title: "Приложение Play для детей не должно сохранять рекламный идентификатор"
  summary: "Правила программы «Для всей семьи» указывают, что приложения, ориентированные исключительно на детей, не должны запрашивать разрешение AD_ID на Android API 33 или выше и не должны передавать рекламный идентификатор детей. Ответ проекта не доказывает, что приложение ориентировано исключительно на детей, поэтому это риск, а не отказ, и не юридическая консультация."
legal.kvkk.consent-answered:
  title: "На вопрос KVKK о явном согласии должен быть дан ответ"
  summary: "Источник — сообщение KVKK об обязанности уведомления. Эта проверка только спрашивает, ответил ли проект на kvkk.explicitConsent. Она не решает, нужно ли для обработки согласие, и не является юридической консультацией."
