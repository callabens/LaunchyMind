      tr: "IAB Tech Lab app-ads.txt 1.0, uygulamalar için ads.txt standardıdır. ads.txt 1.1 OWNERDOMAIN ve MANAGERDOMAIN ekler. Bu kontrol beyan edilen sitenin kökünden app-ads.txt ister. Satıcı kimliği uydurmaz."
