apple.privacy-policy-in-app:
  summary: "El código de la app aún no tiene un enlace a la política de privacidad. La directriz 5.1.1(i) pide uno dentro de la app. Es un solo enlace que falta, no un juicio sobre el resto de la app."
  next: "Añade la URL de privacidad en una pantalla que se pueda abrir, como los ajustes, y vuelve a analizar."
