capabilities:
  camera:
    packages: [camera, camerawesome, camera_android]
    iosUsage: [NSCameraUsageDescription]
    androidPermissions: [android.permission.CAMERA]
  photos:
    packages: [image_picker, photo_manager, image_cropper]
    iosUsage: [NSPhotoLibraryUsageDescription, NSPhotoLibraryAddUsageDescription]
    androidPermissions: [android.permission.READ_MEDIA_IMAGES, android.permission.READ_EXTERNAL_STORAGE]
  location:
    packages: [geolocator, location, geocoding]
    iosUsage: [NSLocationWhenInUseUsageDescription, NSLocationAlwaysAndWhenInUseUsageDescription, NSLocationAlwaysUsageDescription]
    androidPermissions: [android.permission.ACCESS_FINE_LOCATION, android.permission.ACCESS_COARSE_LOCATION]
  microphone:
    packages: [record, speech_to_text, flutter_sound]
    iosUsage: [NSMicrophoneUsageDescription]
    androidPermissions: [android.permission.RECORD_AUDIO]
  contacts:
    packages: [flutter_contacts, contacts_service, fast_contacts]
    iosUsage: [NSContactsUsageDescription]
    androidPermissions: [android.permission.READ_CONTACTS]
  notifications:
    packages: [firebase_messaging, flutter_local_notifications, onesignal_flutter]
    iosUsage: []
    androidPermissions: [android.permission.POST_NOTIFICATIONS]
  ads:
    packages: [google_mobile_ads, unity_ads_plugin, applovin_max, ironsource_mediation]
    iosUsage: []
    androidPermissions: []
  tracking:
    packages: [app_tracking_transparency, facebook_app_events, appsflyer_sdk, adjust_sdk]
    iosUsage: [NSUserTrackingUsageDescription]
    androidPermissions: []
  accounts:
    packages: [firebase_auth, supabase_flutter, appwrite, auth0_flutter, amplify_auth_cognito]
    iosUsage: []
    androidPermissions: []
  payments:
    packages: [in_app_purchase, purchases_flutter, flutter_inapp_purchase]
    iosUsage: []
    androidPermissions: [com.android.vending.BILLING]
  analytics:
    packages: [firebase_analytics, firebase_crashlytics, mixpanel_flutter, amplitude_flutter, sentry_flutter, posthog_flutter]
    iosUsage: []
    androidPermissions: []
