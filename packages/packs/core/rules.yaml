# Enabled rules. Summaries were checked against the cited pages on 2026-11-19.
# appliesWhen is what the engine uses. platforms is for readers.
rules:
  - id: product.flutter-project
    title: This preview scans Flutter, React Native, and Expo
    severity: risk
    platforms: [any]
    enabled: true
    origin: product
    verification:
      status: verified
      verifiedAt: 2026-11-20
      method: product-rule
      note: This is a LaunchyMind limit, not a store rule.
    source:
      url: https://github.com/callabens/LaunchyMind
      section: scanner
      publisher: LaunchyMind
    summary:
      en: "This preview reads Flutter, React Native, and Expo projects. A folder that is none of those is not given a store verdict. Checks that the scanner cannot see stay unchecked."
      tr: "Bu önizleme Flutter, React Native ve Expo projelerini okur. Bunların hiçbiri olmayan klasör için mağaza kararı üretilmez. Görülemeyen kontroller kontrol edilemedi kalır."
    appliesWhen:
      all:
        - { fact: framework.flutter, neq: "unused" }
    evaluate:
      pass:
        any:
          - { fact: framework.flutter, eq: true }
          - { fact: framework.react_native, eq: true }
          - { fact: framework.expo, eq: true }
      fail:
        all:
          - { fact: framework.flutter, eq: false }
          - { fact: framework.react_native, eq: false }
          - { fact: framework.expo, eq: false }
    check:
      confidence: direct
      note: "Flutter is a pubspec SDK dependency. React Native is a react-native dependency. Expo is an expo dependency or an app.json expo field. Native-only folders are not scanned."

  - id: product.audience-answers
    title: Audience questions the code cannot answer
    severity: risk
    platforms: [any]
    enabled: true
    origin: product
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: product-rule
      note: Kids, health, and user-generated content are not inferred from code.
    source:
      url: https://github.com/callabens/LaunchyMind
      section: audience
      publisher: LaunchyMind
    summary:
      en: "Kids, health, and user-generated content cannot be reliably read from code. Until .launchymind/project.yaml answers them, those topics stay unchecked."
      tr: "Çocuk kitlesi, sağlık ve kullanıcı içeriği koddan güvenilir okunamaz. .launchymind/project.yaml cevap verene kadar kontrol edilemedi kalır."
    appliesWhen:
      any:
        - { fact: platform.ios, eq: true }
        - { fact: platform.android, eq: true }
    evaluate:
      pass:
        all:
          - any:
              - { fact: audience.kids, eq: "yes" }
              - { fact: audience.kids, eq: "no" }
          - any:
              - { fact: audience.health, eq: "yes" }
              - { fact: audience.health, eq: "no" }
          - any:
              - { fact: audience.ugc, eq: "yes" }
              - { fact: audience.ugc, eq: "no" }
    check:
      confidence: attestation
      note: "A missing answer is unchecked, not a guess. Answering no does not by itself mean the store category is correct."

  - id: apple.kids-third-party
    title: Kids-directed apps should avoid third-party ads and analytics
    severity: risk
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "1.3 and 5.1.4"
      publisher: Apple
    summary:
      en: "Apple says apps intended primarily for kids should not include third-party analytics or third-party advertising. The audience answer is the developer's statement, not the Kids Category checkbox."
      tr: "Apple, öncelikle çocuklara yönelik uygulamaların üçüncü taraf analitik veya reklam içermemesini söyler. Kitle cevabı, geliştiricinin beyanıdır."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
        - { fact: audience.kids, eq: "yes" }
    evaluate:
      pass:
        all:
          - { fact: capability.ads, eq: false }
          - { fact: capability.analytics, eq: false }
      fail:
        any:
          - { fact: capability.ads, eq: true }
          - { fact: capability.analytics, eq: true }
    check:
      confidence: attestation
      note: "The guideline text says should, and this check only sees packages plus the audience answer. It is a risk, not a proven Kids Category rejection."

  - id: apple.privacy-policy-in-app
    title: The app needs an in-app privacy policy link
    severity: blocker
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "5.1.1(i)"
      publisher: Apple
    summary:
      en: "The app source has no privacy policy link yet. Guideline 5.1.1(i) asks for one inside the app. This is one missing link, not a judgement that the rest of the app should be thrown out."
      tr: "Uygulama kaynağında henüz gizlilik politikası bağlantısı yok. Kılavuz 5.1.1(i) bağlantının uygulama içinde olmasını ister. Bu tek eksik bağlantıdır; uygulamanın geri kalanının çöpe atılması değildir."
    next:
      en: "Add the privacy URL on a screen people can open, such as settings, then scan again."
      tr: "Gizlilik adresini ayarlar gibi açılan bir ekrana koyun ve yeniden tarayın."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
    evaluate:
      pass:
        all:
          - { fact: urls.privacy.in_app, eq: true }
      fail:
        all:
          - { fact: urls.privacy.in_app, eq: false }
    check:
      confidence: direct
      note: "A privacy URL in Dart, Info.plist, or Android strings counts as in-app. A URL that exists only in .launchymind/project.yaml does not."
    fix: privacy-policy

  - id: apple.privacy-policy-metadata
    title: Privacy policy URL declared for store metadata
    severity: risk
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "5.1.1(i)"
      publisher: Apple
    summary:
      en: "Guideline 5.1.1(i) also asks for the privacy policy link in App Store Connect. LaunchyMind cannot see App Store Connect. A missing local declaration is unchecked, not a failure."
      tr: "Kılavuz 5.1.1(i) bağlantının App Store Connect bilgisinde de olmasını ister. LaunchyMind Connect'i görmez. Yerel beyan yoksa bu başarısızlık değil, kontrol edilemedi demektir."
    next:
      en: "If you want this recorded in the project, set urls.privacy in .launchymind/project.yaml. Leave it blank if the link exists only in App Store Connect."
      tr: "Projede kayıt olsun istiyorsanız .launchymind/project.yaml içine urls.privacy yazın. Bağlantı yalnızca App Store Connect'teyse boş bırakın."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
    evaluate:
      pass:
        all:
          - { fact: urls.privacy.declared, eq: true }
    check:
      confidence: attestation
      note: "No local declaration stays unchecked. A broken declared URL is handled by the live link check, not by calling this a failure."

  - id: apple.privacy-link-opens
    title: The privacy policy link opens
    severity: risk
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "5.1.1(i)"
      publisher: Apple
    summary:
      en: "The in-app and metadata privacy link has to be a real policy. This check requests the URL found in the project and flags HTTP errors and placeholder pages."
      tr: "Gizlilik bağlantısı gerçek bir politika sayfası olmalıdır. Bu kontrol proje adresini ister; HTTP hatasını ve yer tutucu sayfayı işaretler."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
        - { fact: urls.privacy.present, eq: true }
    evaluate:
      pass:
        all:
          - { fact: live.privacy.status, eq: "ok" }
      fail:
        any:
          - { fact: live.privacy.status, eq: "placeholder" }
          - { fact: live.privacy.status, eq: "http-error" }
          - { fact: live.privacy.status, eq: "missing" }
    check:
      confidence: heuristic
      note: "Offline mode and network failures stay unchecked. A timeout is not treated as a broken policy."

  - id: apple.privacy-policy-content
    title: Privacy policy text covers collection, deletion, and consent
    severity: risk
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "5.1.1(i)"
      publisher: Apple
    summary:
      en: "Guideline 5.1.1(i) says the policy must identify what is collected and how, all uses, third-party protection, retention and deletion, and how a user can revoke consent or request deletion. Keyword hits are a heuristic, not a review of the policy."
      tr: "Kılavuz 5.1.1(i) politikanın ne toplandığını, kullanımları, saklama ve silmeyi ve rızanın nasıl geri alınacağını anlatmasını ister. Anahtar kelime bir inceleme değildir."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
        - { fact: urls.privacy.present, eq: true }
    evaluate:
      pass:
        all:
          - { fact: live.privacy.status, eq: "ok" }
          - { fact: live.privacy.collection, eq: "yes" }
          - { fact: live.privacy.deletion, eq: "yes" }
          - { fact: live.privacy.consent, eq: "yes" }
      fail:
        any:
          - { fact: live.privacy.status, eq: "placeholder" }
          - all:
              - { fact: live.privacy.status, eq: "ok" }
              - { fact: live.privacy.collection, eq: "no" }
          - all:
              - { fact: live.privacy.status, eq: "ok" }
              - { fact: live.privacy.deletion, eq: "no" }
          - all:
              - { fact: live.privacy.status, eq: "ok" }
              - { fact: live.privacy.consent, eq: "no" }
    check:
      confidence: heuristic
      note: "Passes only when the fetched page contains rough signals for collection, deletion, and consent withdrawal. This is not legal advice."
    fix: privacy-policy

  - id: apple.support-contact
    title: Support URL or contact path is present
    severity: risk
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "1.5"
      publisher: Apple
    summary:
      en: "Guideline 1.5 says people need a way to reach you. If the project has no support URL, LaunchyMind cannot see the App Store Connect field, so the result stays unchecked. A declared page that does not open is a separate check."
      tr: "Kılavuz 1.5 insanların size ulaşabilmesini söyler. Projede destek adresi yoksa App Store Connect alanı görünmez; sonuç kontrol edilemedi kalır. Beyan edilen sayfa açılmazsa bunu ayrı kontrol ele alır."
    next:
      en: "Add a support URL in the app or in project.yaml, or confirm the Support URL field in App Store Connect yourself."
      tr: "Uygulamaya veya project.yaml dosyasına destek adresi ekleyin, ya da App Store Connect alanını kendiniz doğrulayın."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
    evaluate:
      pass:
        all:
          - { fact: urls.support.present, eq: true }
    check:
      confidence: direct
      note: "Absence is unchecked. The live support-page check fails only when a URL was found and the page is broken or has no contact path."

  - id: apple.support-link-quality
    title: Support page shows a way to make contact
    severity: risk
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "1.5"
      publisher: Apple
    summary:
      en: "The support page should give people an easy way to make contact. This check looks for an email address or a contact phrase and rejects placeholder pages."
      tr: "Destek sayfası kolay bir iletişim yolu sunmalıdır. Bu kontrol e-posta veya iletişim ifadesi arar ve yer tutucuyu reddeder."
    appliesWhen:
      all:
        - { fact: urls.support.present, eq: true }
    evaluate:
      pass:
        all:
          - { fact: live.support.status, eq: "ok" }
          - { fact: live.support.contact, eq: "yes" }
      fail:
        any:
          - { fact: live.support.status, eq: "placeholder" }
          - { fact: live.support.status, eq: "http-error" }
          - { fact: live.support.status, eq: "missing" }
          - all:
              - { fact: live.support.status, eq: "ok" }
              - { fact: live.support.contact, eq: "no" }
    check:
      confidence: heuristic
      note: "A page can pass this keyword check and still be a poor support experience."

  - id: apple.account-deletion
    title: Account creation requires in-app account deletion
    severity: blocker
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "5.1.1(v)"
      publisher: Apple
    summary:
      en: "If the app supports account creation, it must also offer account deletion within the app. This check looks for deletion symbols or an in-app deletion link. It cannot judge whether the control is easy to find."
      tr: "Uygulama hesap oluşturmayı destekliyorsa, hesap silmeyi de uygulama içinde sunmalıdır. Bu kontrol silme izi veya uygulama içi bağlantı arar."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
        - { fact: capability.accounts, eq: true }
    evaluate:
      pass:
        all:
          - { fact: account.deletion.in_app, eq: true }
      fail:
        all:
          - { fact: account.deletion.in_app, eq: false }
    check:
      confidence: heuristic
      note: "Account packages are a fixed list. A custom auth stack with no mapped package is not detected, and that limit is reported separately."
    fix: account-deletion

  - id: apple.tracking-permission
    title: Tracking requires App Tracking Transparency disclosure
    severity: blocker
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "5.1.2(i)"
      publisher: Apple
    summary:
      en: "You must receive explicit permission via the App Tracking Transparency APIs to track users. When an ads or tracking SDK is present, this check requires NSUserTrackingUsageDescription."
      tr: "Kullanıcıları takip etmek için App Tracking Transparency ile açık izin gerekir. Reklam veya takip SDK'sı varsa NSUserTrackingUsageDescription aranır."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
        - { fact: tracking.att_required, eq: "yes" }
    evaluate:
      pass:
        all:
          - { fact: ios.usage.tracking, eq: true }
      fail:
        all:
          - { fact: ios.usage.tracking, eq: false }
    check:
      confidence: direct
      note: "Ads and known tracking packages make this apply. Set apple.att-not-required in project.yaml only when you have a real reason the SDK does not track. Analytics packages alone do not select this rule."
    fix: purpose-string

  - id: apple.login-equivalent
    title: Third-party login needs an equivalent option
    severity: risk
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "4.8"
      publisher: Apple
    summary:
      en: "Apps that use a third-party or social login for the primary account must also offer an equivalent login that limits data to name and email, lets the user hide their email, and does not collect app interactions for advertising without consent. Apple lists exceptions this check cannot see."
      tr: "Birincil hesap için üçüncü taraf giriş kullanan uygulama, veri toplamayı ad ve e-posta ile sınırlayan eşdeğer bir giriş de sunmalıdır. Apple'ın istisnalarını bu kontrol göremez."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
        - { fact: capability.non_apple_third_party_login, eq: true }
    evaluate:
      pass:
        any:
          - { fact: capability.apple_sign_in, eq: true }
          - { fact: attestation.apple.login_exception, eq: "yes" }
      fail:
        all:
          - { fact: capability.apple_sign_in, eq: false }
          - { fact: attestation.apple.login_exception, neq: "yes" }
    check:
      confidence: heuristic
      note: "Sign in with Apple is treated as the equivalent option. An exception attestation is the developer's statement that a listed 4.8 exception applies. The privacy properties of another login are not verified."

  - id: apple.permission-camera
    title: Camera use needs an iOS purpose string
    severity: blocker
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "5.1.1(ii)"
      publisher: Apple
    summary:
      en: "Purpose strings must clearly and completely describe the use of the data. A detected camera capability without NSCameraUsageDescription fails this check."
      tr: "İzin metni verinin kullanımını açık ve eksiksiz anlatmalıdır. Kamera kullanımı varken NSCameraUsageDescription yoksa bu kontrol kalır."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
        - { fact: capability.camera, eq: true }
    evaluate:
      pass:
        all:
          - { fact: ios.usage.camera, eq: true }
      fail:
        all:
          - { fact: ios.usage.camera, eq: false }
    check:
      confidence: direct
      note: "An empty string counts as missing. The wording is not graded."
    fix: purpose-string

  - id: apple.permission-photos
    title: Photo library use needs an iOS purpose string
    severity: blocker
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "5.1.1(ii)"
      publisher: Apple
    summary:
      en: "Photo library access needs a purpose string that describes the use. NSPhotoLibraryUsageDescription or NSPhotoLibraryAddUsageDescription satisfies the presence check."
      tr: "Fotoğraf kitaplığı erişimi, kullanımı anlatan bir izin metni ister. NSPhotoLibraryUsageDescription veya NSPhotoLibraryAddUsageDescription varlık kontrolünü geçer."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
        - { fact: capability.photos, eq: true }
    evaluate:
      pass:
        all:
          - { fact: ios.usage.photos, eq: true }
      fail:
        all:
          - { fact: ios.usage.photos, eq: false }
    check:
      confidence: direct
      note: "Presence only. Add-only and full-library access are not distinguished beyond the two keys."
    fix: purpose-string

  - id: apple.permission-location
    title: Location use needs an iOS purpose string
    severity: blocker
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "5.1.1(ii)"
      publisher: Apple
    summary:
      en: "Location access needs a purpose string. When-in-use or always keys satisfy the presence check."
      tr: "Konum erişimi bir izin metni ister. Kullanırken veya her zaman anahtarları varlık kontrolünü geçer."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
        - { fact: capability.location, eq: true }
    evaluate:
      pass:
        all:
          - { fact: ios.usage.location, eq: true }
      fail:
        all:
          - { fact: ios.usage.location, eq: false }
    check:
      confidence: direct
      note: "Does not decide whether always-on location is justified."
    fix: purpose-string

  - id: apple.permission-microphone
    title: Microphone use needs an iOS purpose string
    severity: blocker
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "5.1.1(ii)"
      publisher: Apple
    summary:
      en: "Microphone access needs NSMicrophoneUsageDescription describing the use."
      tr: "Mikrofon erişimi, kullanımı anlatan NSMicrophoneUsageDescription ister."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
        - { fact: capability.microphone, eq: true }
    evaluate:
      pass:
        all:
          - { fact: ios.usage.microphone, eq: true }
      fail:
        all:
          - { fact: ios.usage.microphone, eq: false }
    check:
      confidence: direct
      note: "Presence only."
    fix: purpose-string

  - id: apple.permission-contacts
    title: Contacts use needs an iOS purpose string
    severity: blocker
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "5.1.1(ii)"
      publisher: Apple
    summary:
      en: "Contacts access needs NSContactsUsageDescription describing the use."
      tr: "Kişiler erişimi, kullanımı anlatan NSContactsUsageDescription ister."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
        - { fact: capability.contacts, eq: true }
    evaluate:
      pass:
        all:
          - { fact: ios.usage.contacts, eq: true }
      fail:
        all:
          - { fact: ios.usage.contacts, eq: false }
    check:
      confidence: direct
      note: "Presence only. Guideline 5.1.2 limits on contact databases are not inferred from source."
    fix: purpose-string

  - id: apple.privacy-manifest-reasons
    title: Required-reason APIs in a privacy manifest need reason codes
    severity: blocker
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/documentation/bundleresources/describing-use-of-required-reason-api
      section: "NSPrivacyAccessedAPITypes"
      publisher: Apple
    summary:
      en: "Since 1 May 2024, apps that use a required-reason API and do not describe the reason in a privacy manifest are not accepted by App Store Connect. This check fails only when a project manifest lists an API without a reason code."
      tr: "1 Mayıs 2024'ten beri, required-reason API kullanıp nedenini privacy manifest'te yazmayan uygulamalar App Store Connect'e kabul edilmez. Bu kontrol yalnızca projede neden kodu eksik bir API görürse kalır."
    appliesWhen:
      all:
        - { fact: ios.privacy_manifest.incomplete_reasons, eq: true }
    evaluate:
      fail:
        all:
          - { fact: ios.privacy_manifest.incomplete_reasons, eq: true }
    check:
      confidence: direct
      note: "Not finding a manifest is not a pass. API use inside dependencies and Dart is not fully scanned. See the scan limits."
    fix: privacy-manifest

  - id: apple.listed-sdk-manifest
    title: Listed third-party SDKs need their privacy manifests
    severity: risk
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/support/third-party-SDK-requirements/
      section: "SDKs that require a privacy manifest and signature"
      publisher: Apple
    summary:
      en: "Apple requires a privacy manifest for listed SDKs included in a submission. Plugins in LaunchyMind's versioned table ship their own PrivacyInfo.xcprivacy, so those do not stay unchecked. A listed SDK that is not in that table still needs an attestation."
      tr: "Apple, gönderime giren listeli SDK'lar için privacy manifest ister. LaunchyMind tablosundaki eklentiler kendi PrivacyInfo.xcprivacy dosyasını taşır; onlar kontrol edilemedi kalmaz. Tabloda olmayan listeli SDK için beyan gerekir."
    next:
      en: "For a listed SDK that is not in the bundled-manifest table, check the pod or package and set apple.listed-sdk-manifests only after you have seen the file."
      tr: "Tabloda olmayan listeli bir SDK için pod veya pakete bakın ve dosyayı gördükten sonra apple.listed-sdk-manifests yazın."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
        - { fact: capability.listed_sdk, eq: true }
    evaluate:
      pass:
        any:
          - { fact: attestation.apple.listed_sdk_manifests, eq: "yes" }
          - { fact: listed_sdk.bundled_manifests, eq: "covered" }
      fail:
        all:
          - { fact: attestation.apple.listed_sdk_manifests, eq: "no" }
    check:
      confidence: direct
      note: "Checked 2026-11-20. path_provider_foundation 2.3.2 added PrivacyInfo.xcprivacy and 2.6.0 deleted it when the iOS implementation became Dart FFI. The app-facing path_provider package does not ship that file. Without a lockfile path_provider_foundation in 2.3.2 up to but not including 2.6.0, path_provider stays uncovered and this rule stays unchecked unless you attest that you saw the manifest."

