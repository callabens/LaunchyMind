  - id: kvkk.disclosure
    title: KVKK article 10 disclosure themes on the privacy page
    severity: risk
    platforms: [any]
    enabled: true
    origin: legal
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
      note: Read from the official KVKK disclosure guide PDF on 2026-11-19. The guide quotes article 10 and the communiqué.
    source:
      url: https://www.kvkk.gov.tr/SharedFolderServer/CMSFiles/a569a068-c079-4189-b134-f57bc727af7d.pdf
      section: "3.1 and Kanun m.10"
      publisher: Kişisel Verileri Koruma Kurumu
    summary:
      en: "When personal data is obtained, the controller must tell the person, at minimum, the controller's identity, the purpose, who receives the data and why, the collection method and legal ground, and the rights in article 11. The guide lists mobile apps as one electronic way to do that. Keyword hits are not a legal opinion."
      tr: "Kişisel veri elde edilirken en azından veri sorumlusunun kimliği, amaç, aktarım, yöntem ve hukuki sebep ile madde 11 hakları bildirilmelidir. Rehber mobil uygulamayı elektronik yollardan biri olarak sayar. Anahtar kelime hukuki görüş değildir."
    appliesWhen:
      any:
        - { fact: capability.camera, eq: true }
        - { fact: capability.photos, eq: true }
        - { fact: capability.location, eq: true }
        - { fact: capability.microphone, eq: true }
        - { fact: capability.contacts, eq: true }
        - { fact: capability.accounts, eq: true }
        - { fact: capability.ads, eq: true }
        - { fact: capability.analytics, eq: true }
        - { fact: capability.tracking, eq: true }
        - { fact: capability.payments, eq: true }
    evaluate:
      pass:
        all:
          - { fact: live.privacy.status, eq: "ok" }
          - { fact: live.privacy.controller, eq: "yes" }
          - { fact: live.privacy.purpose, eq: "yes" }
          - { fact: live.privacy.transfer, eq: "yes" }
          - { fact: live.privacy.legal_basis, eq: "yes" }
          - { fact: live.privacy.rights, eq: "yes" }
      fail:
        any:
          - { fact: live.privacy.status, eq: "placeholder" }
          - all:
              - { fact: live.privacy.status, eq: "ok" }
              - { fact: live.privacy.controller, eq: "no" }
          - all:
              - { fact: live.privacy.status, eq: "ok" }
              - { fact: live.privacy.purpose, eq: "no" }
          - all:
              - { fact: live.privacy.status, eq: "ok" }
              - { fact: live.privacy.transfer, eq: "no" }
          - all:
              - { fact: live.privacy.status, eq: "ok" }
              - { fact: live.privacy.legal_basis, eq: "no" }
          - all:
              - { fact: live.privacy.status, eq: "ok" }
              - { fact: live.privacy.rights, eq: "no" }
    check:
      confidence: heuristic
      note: "This does not decide that KVKK applies to every app. It is a risk check when the project can collect data. Ask a lawyer. It is not a statement that the app is legally compliant."
    fix: privacy-policy

  - id: kvkk.consent-separate
    title: Explicit consent and the disclosure text are separate steps
    severity: risk
    platforms: [any]
    enabled: true
    origin: legal
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
      note: The official disclosure guide quotes communiqué article 5(1)(f). Principle decision 2026/347 is withheld separately.
    source:
      url: https://www.kvkk.gov.tr/Icerik/4132/aydinlatma-yukumlulugunun-yerine-getirilmesinde-uyulacak-usul-ve-esaslar-hakkinda-teblig
      section: "Madde 5(1)(f)"
      publisher: Kişisel Verileri Koruma Kurumu
    summary:
      en: "Where processing is based on explicit consent, the disclosure duty and the collection of explicit consent are carried out separately. This check does not decide whether the app needs explicit consent. It uses the project's answer."
      tr: "İşleme açık rızaya dayanıyorsa aydınlatma yükümlülüğü ve açık rızanın alınması ayrı ayrı yerine getirilir. Bu kontrol uygulamanın açık rıza gerektirip gerektirmediğine karar vermez; projedeki cevabı kullanır."
    appliesWhen:
      any:
        - { fact: capability.camera, eq: true }
        - { fact: capability.photos, eq: true }
        - { fact: capability.location, eq: true }
        - { fact: capability.microphone, eq: true }
        - { fact: capability.contacts, eq: true }
        - { fact: capability.accounts, eq: true }
        - { fact: capability.ads, eq: true }
        - { fact: capability.analytics, eq: true }
        - { fact: capability.tracking, eq: true }
        - { fact: capability.payments, eq: true }
    evaluate:
      pass:
        any:
          - { fact: kvkk.explicit_consent, eq: "no" }
          - all:
              - { fact: kvkk.explicit_consent, eq: "yes" }
              - { fact: kvkk.consent_separate, eq: "yes" }
      fail:
        all:
          - { fact: kvkk.explicit_consent, eq: "yes" }
          - { fact: kvkk.consent_separate, eq: "no" }
    check:
      confidence: attestation
      note: "Answering no means the developer says processing is not based on explicit consent. That answer is not verified. This is not legal advice."
    next:
      en: "In .launchymind/project.yaml set kvkk.explicitConsent and, when that is true, kvkk.consentSeparate. See the README example."
      tr: ".launchymind/project.yaml içinde kvkk.explicitConsent ve gerekirse kvkk.consentSeparate yazın. README örneğine bakın."

  - id: apple.privacy-manifest-tracking
    title: Ads or tracking should match the privacy manifest tracking fields
    severity: risk
    platforms: [ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
      note: "The privacy manifest is Apple's file for describing tracking. This check only compares the project's own NSPrivacyTracking flag, tracking domains, and collected-data tracking flags. It is a risk when they disagree, or when an ads or ATT app has no app-level manifest."
    source:
      url: https://developer.apple.com/documentation/bundleresources/privacy_manifest_files
      section: "NSPrivacyTracking"
      publisher: Apple
    summary:
      en: "An app that shows ads or asks to track should have an app-level privacy manifest whose NSPrivacyTracking flag agrees with collected data types marked as used for tracking, and with tracking domains when tracking is on. A mismatch is a risk, not a proven rejection."
      tr: "Reklam gösteren veya izleme izni isteyen uygulamanın privacy manifest'inde NSPrivacyTracking işareti, izleme için işaretlenmiş veri türleri ve izleme alan adlarıyla uyumlu olmalıdır. Uyuşmazlık bir risktir, kanıtlanmış ret değildir."
    next:
      en: "Open the app's PrivacyInfo.xcprivacy. If you track, set NSPrivacyTracking to true and list the tracking domains. If a collected data type is marked tracking, the tracking flag should not be false."
      tr: "Uygulamanın PrivacyInfo.xcprivacy dosyasını açın. İzliyorsanız NSPrivacyTracking true olsun ve izleme alan adlarını yazın. Bir veri türü izleme diye işaretliyse izleme bayrağı false olmamalı."
    appliesWhen:
      all:
        - { fact: platform.ios, eq: true }
        - any:
            - { fact: capability.ads, eq: true }
            - { fact: capability.tracking, eq: true }
            - { fact: tracking.att_required, eq: "yes" }
    evaluate:
      pass:
        all:
          - { fact: ios.privacy_manifest.present, eq: true }
          - { fact: ios.privacy_manifest.tracking, eq: "true" }
          - { fact: ios.privacy_manifest.tracking_consistent, eq: "yes" }
      fail:
        any:
          - { fact: ios.privacy_manifest.present, eq: false }
          - { fact: ios.privacy_manifest.tracking, eq: "false" }
          - { fact: ios.privacy_manifest.tracking_consistent, eq: "no" }
    check:
      confidence: heuristic
      note: "Pods are not scanned, so an SDK's own manifest is not treated as the app's. Missing NSPrivacyTracking stays unchecked rather than a pass."

  - id: apple.stub-purchase-ui
    title: Stub or restore-purchase text without a purchase SDK
    severity: risk
    platforms: [any]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developer.apple.com/app-store/review/guidelines/
      section: "2.1(a)"
      publisher: Apple
    summary:
      en: "Guideline 2.1(a) says submissions should be final and placeholder text should be scrubbed. Restore-purchase or stub purchase copy with no purchase SDK from the capability map is a risk, including when a flag currently hides the row."
      tr: "Kılavuz 2.1(a) gönderimin son sürüm olmasını ve yer tutucu metnin temizlenmesini söyler. Satın alma SDK'sı yokken geri yükleme veya taslak satın alma metni bir risktir; satır bir bayrakla gizlenmiş olsa bile."
    next:
      en: "Remove the stub copy before release, or add the real purchase SDK and keep the row out of release builds."
      tr: "Yayından önce taslak metni kaldırın ya da gerçek satın alma SDK'sını ekleyin ve satırı yayın derlemesinin dışında tutun."
    appliesWhen:
      all:
        - { fact: framework.flutter, eq: true }
    evaluate:
      pass:
        all:
          - { fact: payments.stub_ui, eq: false }
      fail:
        all:
          - { fact: payments.stub_ui, eq: true }
    check:
      confidence: heuristic
      note: "Looks for phrases such as 'stubbed in this build', 'purchase is stubbed', and 'restore purchases' in lib/. A compile-time flag is not executed."

  - id: google.sample-ad-id
    title: Google sample ad unit ids should not ship
    severity: risk
    platforms: [android, ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developers.google.com/admob/android/test-ads
      section: "Sample ad units"
      publisher: Google
    summary:
      en: "Google publishes sample ad units under the publisher id ca-app-pub-3940256099942544 for testing. That id in Info.plist, the Android manifest, or Dart that is not clearly limited to a debug branch is a risk."
      tr: "Google, deneme için ca-app-pub-3940256099942544 yayıncı kimliği altında örnek reklam birimleri yayınlar. Bu kimlik Info.plist, Android manifest veya hata ayıklama dalıyla sınırlı olmayan Dart kodundaysa bu bir risktir."
    next:
      en: "Keep the sample id behind kDebugMode or kReleaseMode and ship your own ad unit ids in the plist and manifest."
      tr: "Örnek kimliği kDebugMode veya kReleaseMode arkasında tutun; plist ve manifestte kendi reklam birimi kimliklerinizi kullanın."
    appliesWhen:
      all:
        - { fact: capability.ads, eq: true }
    evaluate:
      pass:
        all:
          - { fact: ads.sample_unit_in_shipped_config, eq: false }
      fail:
        all:
          - { fact: ads.sample_unit_in_shipped_config, eq: true }
    check:
      confidence: heuristic
      note: "The publisher id was read from Google's test-ads page on 2026-11-19. A sample id next to kDebugMode plus a different ca-app-pub id in the same Dart file is not treated as shipped."

  - id: google.ump-consent-call
    title: Ad apps should request a UMP consent update
    severity: risk
    platforms: [android, ios]
    enabled: true
    origin: store
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: primary-source
    source:
      url: https://developers.google.com/admob/flutter/eu-consent
      section: "requestConsentInfoUpdate"
      publisher: Google
    summary:
      en: "Google's AdMob EU-consent guide says to request a user-messaging consent update on launch, because consent is required in some regions. An ads SDK with no requestConsentInfoUpdate, ConsentInformation, or UserMessagingPlatform call in lib/ is a risk."
      tr: "Google'ın AdMob AB rıza rehberi, bazı bölgelerde rıza gerektiği için açılışta kullanıcı mesajlaşma rızasının güncellenmesini söyler. lib/ içinde requestConsentInfoUpdate, ConsentInformation veya UserMessagingPlatform çağrısı olmayan reklam SDK'sı bir risktir."
    next:
      en: "Call ConsentInformation.instance.requestConsentInfoUpdate before loading ads, and keep a privacy-options entry point where Google says one is required."
      tr: "Reklam yüklemeden önce ConsentInformation.instance.requestConsentInfoUpdate çağırın ve Google'ın istediği yerde gizlilik seçenekleri girişini tutun."
    appliesWhen:
      all:
        - { fact: capability.ads, eq: true }
    evaluate:
      pass:
        all:
          - { fact: ads.ump_requested, eq: true }
      fail:
        all:
          - { fact: ads.ump_requested, eq: false }
    check:
      confidence: heuristic
      note: "This is a source search, not proof the form is shown in the EEA. The ATT purpose string is a different check."

  - id: product.kids-policy-consistency
    title: A not-for-children policy should match the kids answer
    severity: risk
    platforms: [any]
    enabled: true
    origin: product
    verification:
      status: verified
      verifiedAt: 2026-11-19
      method: product-rule
      note: "Compares the project's own privacy-page words with audience.kids. It does not decide the App Store age rating."
    source:
      url: https://github.com/callabens/LaunchyMind
      section: audience
      publisher: LaunchyMind
    summary:
      en: "When the fetched privacy page says the app is not directed to children, audience.kids should not be yes. A missing answer stays unchecked so the page and the project file can be lined up."
      tr: "Gizlilik sayfası uygulamanın çocuklara yönelik olmadığını söylüyorsa audience.kids yes olmamalı. Cevap yoksa, sayfa ile proje dosyası örtüşsün diye sonuç kontrol edilemedi kalır."
    next:
      en: "If the page is right, set audience.kids: false in .launchymind/project.yaml. If the app is for children, change the page and answer the store age-rating questions."
      tr: "Sayfa doğruysa .launchymind/project.yaml içinde audience.kids: false yazın. Uygulama çocuklar içinse sayfayı değiştirin ve mağaza yaş sorularını cevaplayın."
    appliesWhen:
      all:
        - { fact: live.privacy.not_for_children, eq: "yes" }
    evaluate:
      pass:
        all:
          - { fact: audience.kids, eq: "no" }
      fail:
        all:
          - { fact: audience.kids, eq: "yes" }
    check:
      confidence: heuristic
      note: "Looks for phrases such as 'not directed to children', 'children under 13', and '13 yaş altı'. It does not read the age-rating form in App Store Connect."
